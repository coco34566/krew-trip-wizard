name: memi-deep-audit
on:
  pull_request:

permissions:
  contents: read

jobs:
  deep-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Install pinned Memi CLI
        run: npm install --global --ignore-scripts --no-audit --no-fund @memi-design/cli@2.7.9
      - name: Run UX audit
        run: memi ux audit . --json --no-write > memi-ux.json
      - name: Run craft audit
        run: memi craft audit . --json --no-write > memi-craft.json
      - name: Upload deep audit reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memi-deep-audit
          path: |
            memi-ux.json
            memi-craft.json
