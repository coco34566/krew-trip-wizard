name: KREW PR build

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: krew-pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply editorial hub wording
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/routes/_authenticated/trips.$tripId.index.tsx')
          text = path.read_text()
          replacements = {
            'exceptional_property: "Le logement fait le voyage"': 'exceptional_property: "L’hébergement fait le voyage"',
            '{ title: "Mon Voyage — KREW" }': '{ title: "Voyage — KREW" }',
            '{ property: "og:title", content: "Mon Voyage — KREW" }': '{ property: "og:title", content: "Voyage — KREW" }',
            'content: "Compare les propositions et valide le voyage avec ton groupe."': 'content: "Compare les propositions et avance avec ton groupe."',
            'toast.success("Nombre de participants mis à jour !");': 'toast.success("Nombre de participants mis à jour");',
            'toast.error(err?.message || "Erreur lors de la mise à jour");': 'console.error("Impossible de mettre à jour le nombre de participants:", err);\n      toast.error("Impossible de mettre à jour le nombre de participants pour le moment.");',
            'toast.error(err?.message || "Erreur de mise à jour");': 'console.error("Impossible d’enregistrer les paramètres de la Star:", err);\n      toast.error("Impossible d’enregistrer ces choix pour le moment.");',
            'toast.success("Co-organisateur·rice nommé·e !");': 'toast.success("Co-organisateur·rice nommé·e");',
            'toast.success("Rôle co-organisateur·rice retiré.");': 'toast.success("Rôle de co-organisateur·rice retiré");',
            'toast.error("Erreur lors de la mise à jour des rôles.");': 'toast.error("Impossible de mettre à jour ce rôle pour le moment.");',
            'toast.error(`Erreur : ${err.message}`);': 'console.error("Impossible de mettre à jour la tâche:", err);\n      toast.error("Impossible de mettre à jour cette tâche pour le moment.");',
            'toast.success("Tâche réassignée avec succès");': 'toast.success("Tâche réattribuée");',
            'toast.success(`${res.count} tâche(s) générée(s) / synchronisée(s) !`);': 'toast.success(`${res.count} tâche${res.count > 1 ? "s" : ""} prête${res.count > 1 ? "s" : ""}`);',
            'toast.warning(res.message || "Aucune tâche générée");': 'toast.warning("Aucune tâche à ajouter pour le moment.");',
            'const handleMutationError = (error: any, fallbackMessage: string) => {\n    const errMsg = String(error?.message || "");\n    if (errMsg.includes("RATE_LIMITED:")) {\n      const cleanMsg = errMsg.split("RATE_LIMITED:")[1]?.trim();\n      if (cleanMsg) {\n        toast.error(cleanMsg);\n        return;\n      }\n    }\n    toast.error(String(error?.message ?? fallbackMessage).slice(0, 160));\n  };': 'const handleMutationError = (error: any, fallbackMessage: string) => {\n    console.error(fallbackMessage, error);\n    toast.error(fallbackMessage);\n  };',
            'toast.success("Profil du voyage validé !");': 'toast.success("Profil du voyage enregistré");',
            'onError: (error: any) => toast.error(String(error?.message ?? "Validation impossible")),': 'onError: (error: any) => {\n      console.error("Impossible d’enregistrer le Profil du voyage:", error);\n      toast.error("Impossible d’enregistrer le Profil du voyage pour le moment.");\n    },',
            'onError: (e: any) =>\n      toast.error(String(e?.message ?? "Vote activité impossible").slice(0, 120)),': 'onError: (e: any) => {\n      console.error("Impossible d’enregistrer le vote activité:", e);\n      toast.error("Impossible d’enregistrer ton vote pour le moment.");\n    },',
            'toast.success("Activités validées pour le voyage");': 'toast.success("Activités choisies pour le voyage");',
            'onError: (e: any) => toast.error(String(e?.message ?? "Validation impossible").slice(0, 120)),': 'onError: (e: any) => {\n      console.error("Impossible d’enregistrer les activités:", e);\n      toast.error("Impossible d’enregistrer les activités choisies pour le moment.");\n    },',
            'toast.success(\n          res.usedLlm ? "Planning activités généré (IA)" : "Planning activités généré (mode local)",\n        );': 'toast.success("Planning prêt");',
            'onError: (e: any) => handleMutationError(e, "Génération planning impossible"),': 'onError: (e: any) => handleMutationError(e, "Impossible de préparer le planning pour le moment."),',
            'onError: (e: any) => toast.error(String(e?.message ?? "Régénération impossible").slice(0, 140)),': 'onError: (e: any) => {\n      console.error("Impossible de proposer une autre option:", e);\n      toast.error("Impossible de proposer une autre option pour le moment.");\n    },',
            'toast.success(`Hébergements : ${nH} hôtels`);': 'toast.success(`${nH} hébergement${nH > 1 ? "s" : ""} proposé${nH > 1 ? "s" : ""}`);',
            'onError: (e: any) => handleMutationError(e, "Recherche d’hébergements impossible"),': 'onError: (e: any) => handleMutationError(e, "Impossible de rechercher des hébergements pour le moment."),',
            'toast.success(`Transports : ${nT} proposition(s)`);': 'toast.success(`${nT} trajet${nT > 1 ? "s" : ""} proposé${nT > 1 ? "s" : ""}`);',
            'onError: (e: any) => handleMutationError(e, "Recherche logistique impossible"),': 'onError: (e: any) => handleMutationError(e, "Impossible de rechercher les trajets pour le moment."),',
            'toast.success("Vote hôtel enregistré");': 'toast.success("Vote enregistré");',
            'onError: (e: any) => toast.error(String(e?.message ?? "Vote impossible").slice(0, 120)),': 'onError: (e: any) => {\n      console.error("Impossible d’enregistrer le vote hébergement:", e);\n      toast.error("Impossible d’enregistrer ton vote pour le moment.");\n    },',
            'onError: (e: any) => toast.error(String(e?.message ?? "Erreur filtres").slice(0, 120)),': 'onError: (e: any) => {\n      console.error("Impossible d’enregistrer les horaires:", e);\n      toast.error("Impossible d’enregistrer ces horaires pour le moment.");\n    },',
            'toast.success("Trajet choisi — visible pour ta ville de départ");': 'toast.success("Mon trajet est enregistré");',
            'onError: (e: any) => toast.error(String(e?.message ?? "Choix impossible").slice(0, 120)),': 'onError: (e: any) => {\n      console.error("Impossible d’enregistrer le trajet:", e);\n      toast.error("Impossible d’enregistrer ton trajet pour le moment.");\n    },',
            'toast.success("Statut de réservation mis à jour !");': 'toast.success("Statut de réservation mis à jour");',
            'onError: (e: any) => toast.error(String(e?.message ?? "Erreur de statut").slice(0, 120)),': 'onError: (e: any) => {\n      console.error("Impossible de mettre à jour le statut de réservation:", e);\n      toast.error("Impossible de mettre à jour ce statut pour le moment.");\n    },',
            'toast.success("Destination validée pour le groupe !");': 'toast.success("Destination choisie pour le groupe");',
            'onError: () => toast.error("Adresse email invalide ou déjà invitée"),': 'onError: () => toast.error("Cette adresse e-mail est invalide ou a déjà été invitée."),',
            'res.status === "absent" ? "Tu as déclaré ton absence" : "Tu participes de nouveau !",': 'res.status === "absent" ? "Ton absence est enregistrée" : "Tu participes de nouveau",',
            'onError: (e: any) => toast.error(String(e?.message ?? "Erreur de mise à jour").slice(0, 120)),': 'onError: (e: any) => {\n      console.error("Impossible de mettre à jour ta participation:", e);\n      toast.error("Impossible de mettre à jour ta participation pour le moment.");\n    },',
            'toast.success(res.mode === "deleted" ? "Voyage supprimé" : "Voyage annulé");': 'toast.success(res.mode === "deleted" ? "Voyage supprimé" : "Voyage archivé");',
            'onError: (e: any) => toast.error(String(e?.message ?? e).slice(0, 120)),': 'onError: (e: any) => {\n      console.error("Impossible de gérer le voyage:", e);\n      toast.error("Impossible d’effectuer cette action pour le moment.");\n    },',
            'toast.error(res?.readiness?.message ?? "Pas assez de réponses pour générer");': 'toast.error("Les préférences nécessaires du groupe ne sont pas encore toutes renseignées.");',
            'toast.warning("Aucune proposition générée — réessaie ou élargis les critères");': 'toast.warning("Aucune destination ne correspond aux critères actuels. Élargis les préférences puis réessaie.");',
            'toast.success(`${res.count} proposition(s) générée(s)`);': 'toast.success(`${res.count} destination${res.count > 1 ? "s" : ""} proposée${res.count > 1 ? "s" : ""}`);',
            'onError: (e: any) => handleMutationError(e, "Erreur lors de la génération"),': 'onError: (e: any) => handleMutationError(e, "Impossible de proposer des destinations pour le moment."),',
            '`Salut ! Viens rejoindre l\'aventure pour organiser notre voyage « ${trip.name || "KREW"} » ! ✈️🥳`,': '`Salut ! On organise « ${trip.name || "notre voyage"} » avec KREW.`,',
            '`Rejoins-nous et donne tes dispos en 2 min : 👉 ${window.location.origin}/join/${trip.id}`,': '`Rejoins le groupe et indique tes disponibilités et tes préférences : ${window.location.origin}/join/${trip.id}`,',
            '`🔔 Petit rappel pour le voyage « ${trip.name || "notre voyage"} » !`,': '`Petit rappel pour « ${trip.name || "notre voyage"} »`,',
            '"Certain·es d\'entre nous n\'ont pas encore eu le temps de remplir leurs infos :",': '"Il reste quelques réponses à compléter :",',
            'if (!p.hasAnsweredAvailability) missing.push("disponibilités 📅");': 'if (!p.hasAnsweredAvailability) missing.push("disponibilités");',
            'if (!p.hasAnswered) missing.push("préférences ⚙️");': 'if (!p.hasAnswered) missing.push("préférences");',
            'lines.push(`• *${name}* : il te manque tes ${missing.join(" et ")}`);': 'lines.push(`• ${name} : ${missing.join(" + ")}`);',
            '`Prenez 2 petites minutes pour compléter vos infos : 👉 ${window.location.origin}/trips/${trip.id}`,': '`${window.location.origin}/trips/${trip.id}`,',
            'Chut... C&apos;est un secret !': 'Une surprise se prépare',
            'Tes ami·e·s te préparent une surprise incroyable pour ton événement (': 'Le groupe prépare le voyage en gardant certaines informations secrètes pour le moment (',
            'Toutes les informations sur la destination, les hébergements et le planning sont gardées\n          secrètes pour te laisser la surprise le jour J.': 'La destination, l’hébergement et le planning apparaîtront au moment prévu par le groupe.',
            'Laisse-toi porter et prépare-toi à vivre un moment inoubliable ! 🎂✨': 'Tu n’as rien à organiser ici pour l’instant.',
            '"Impossible d\'exporter le calendrier : vérifiez que les dates sont verrouillées.",': '"Impossible d’exporter le calendrier. Vérifie que les dates du voyage sont confirmées.",',
            'toast.success("Calendrier .ics téléchargé !");': 'toast.success("Calendrier téléchargé");',
            'Retirer co-org': 'Retirer le rôle de co-organisateur·rice',
            'Nommer co-org': 'Nommer co-organisateur·rice',
            '>\n                          OK\n                        </button>': '>\n                          Enregistrer\n                        </button>',
            'Overview du voyage': 'Résumé du voyage',
            'subtitle: `${progress?.answered ?? 0}/${totalParts} questionnaires`,': 'subtitle: `${progress?.answered ?? 0}/${totalParts} réponses`,',
            ': "À valider",': ': "À confirmer",',
            '? "Profil validé"': '? "Profil enregistré"',
            'subtitle: planDone ? "Programme en place" : "Activités & moments forts",': 'subtitle: planDone ? "Planning en place" : "Activités et moments forts",',
            'subtitle: "Checklist personnalisée",': 'subtitle: "Liste adaptée au voyage",',
            'title: "Vos souvenirs de voyage",': 'title: "Souvenirs du voyage",',
            'subtitle: tripStarted ? "Album & photos du groupe" : "Se débloquera au moment du voyage",': 'subtitle: tripStarted ? "Album et photos du groupe" : "Se débloquera au moment du voyage",',
            'Dates validées': 'Dates confirmées',
            'Les dates du voyage sont validées pour la suite de l’organisation.': 'Les dates du voyage sont confirmées pour la suite de l’organisation.',
            'if (window.confirm("Déverrouiller les dates pour en choisir d\'autres ?"))': 'if (window.confirm("Rendre les dates modifiables pour en choisir d’autres ?"))',
            'Déverrouiller\n              </Button>': 'Modifier les dates\n              </Button>',
            'dispos reçues. L&apos;organisateur·rice valide une fenêtre pour lancer les\n              destinations.': 'disponibilités renseignées. L&apos;organisateur·rice choisit les dates du voyage avant de passer aux\n              destinations.',
            'Valider ces dates': 'Choisir ces dates',
            'toast.success("Dates validées — choisis maintenant le profil du voyage");': 'toast.success("Dates confirmées — choisis maintenant le Profil du voyage");',
            'onError: (e: any) =>\n      toast.error(String(e?.message ?? "Impossible de valider les dates").slice(0, 140)),': 'onError: (e: any) => {\n      console.error("Impossible de confirmer les dates:", e);\n      toast.error("Impossible de confirmer les dates pour le moment.");\n    },',
            'toast.success("Dates déverrouillées");': 'toast.success("Dates à nouveau modifiables");',
            'onError: (e: any) => toast.error(String(e?.message ?? "Erreur").slice(0, 120)),': 'onError: (e: any) => {\n      console.error("Impossible de modifier les dates:", e);\n      toast.error("Impossible de modifier les dates pour le moment.");\n    },',
            'Style & ambiance': 'Style et ambiance',
            'Sélectionne 1 à 3 profils KREW qui correspondent au séjour du groupe.': 'Choisis 1 à 3 options pour définir le Profil du voyage.',
            'Modifier les profils': 'Modifier le Profil du voyage',
            'Le profil apparaîtra lorsque suffisamment de questionnaires auront été complétés.': 'Le Profil du voyage apparaîtra quand suffisamment de préférences auront été renseignées.',
            'Profil validé — les destinations sont disponibles.': 'Profil du voyage enregistré — les destinations sont disponibles.',
            'Valider notre profil de voyage': 'Enregistrer le Profil du voyage',
            'Sélectionne 1 à 3 profils avant de chercher des destinations.': 'Choisis d’abord le Profil du voyage avant de chercher des destinations.',
            'Choisir le profil du voyage': 'Choisir le Profil du voyage',
            'title={readiness && !readiness.canGenerate ? (readiness.message ?? "Questionnaires incomplets") : undefined}': 'title={readiness && !readiness.canGenerate ? "Les préférences nécessaires du groupe ne sont pas encore toutes renseignées." : undefined}',
            '(readiness.message ?? "Les questionnaires doivent être complétés avant de générer les propositions.")': '"Les préférences nécessaires du groupe doivent être renseignées avant de proposer des destinations."',
            'Générer les propositions': 'Voir les destinations',
            'Destination validée —': 'Destination choisie —',
            'Où on dort 🏡': 'Où on dort',
            'To-do orga ·': 'À faire ·',
            '"Recherche de logements momentanément indisponible. Réessaie un peu plus tard."': '"Recherche d’hébergements momentanément indisponible. Réessaie un peu plus tard."',
            '"L\'organisateur·rice proposera bientôt des hôtels à voter."': '"L’organisateur·rice proposera bientôt des hébergements."',
            '{ label: "Voir le logement", url: h.url }': '{ label: "Voir l’hébergement", url: h.url }',
            'Statut de l&apos;hôtel :': 'Statut de l&apos;hébergement :',
            'Voir les transports': 'Voir le transport',
            'Comment on vient ✈️': 'Comment on vient',
            'Continuer vers le planning': 'Voir le planning',
            'Programme du séjour 🗓️': 'Jour par jour',
            'Le programme du séjour, jour par jour.': 'Le planning du séjour, jour par jour.',
            '"Génère le programme du séjour, de l’arrivée au départ."': '"Prépare le planning du séjour, de l’arrivée au départ."',
            'Répartissez les tâches entre vous': 'Répartir les tâches',
            'Clique ici pour répartir la to-do entre les membres du groupe.': 'Répartis les tâches entre les membres du groupe.',
            'Il manque encore du monde': 'Des participants manquent encore',
            'Inviter les participants': 'Inviter le groupe',
            'hôtel : ${liveBudget.topHotelName}': 'hébergement : ${liveBudget.topHotelName}',
            '${liveBudget.transportPicksCount} trajet(s) choisi(s)': '${liveBudget.transportPicksCount} trajet${liveBudget.transportPicksCount > 1 ? "s" : ""} choisi${liveBudget.transportPicksCount > 1 ? "s" : ""}',
          }
          for old, new in replacements.items():
            text = text.replace(old, new)
          path.write_text(text)

      - name: Commit hub wording if needed
        run: |
          if git diff --quiet -- 'src/routes/_authenticated/trips.$tripId.index.tsx'; then
            echo "No hub wording changes left"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add 'src/routes/_authenticated/trips.$tripId.index.tsx'
            git commit -m "Harmonize trip hub wording"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
