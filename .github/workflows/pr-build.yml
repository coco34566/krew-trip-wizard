name: KREW PR build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: krew-pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (report existing baseline debt)
        continue-on-error: true
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee tsc-noemit.log

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build
