name: Refresh Vitest lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate patched Vitest resolution
        run: |
          node - <<'NODE'
          const l = require('./package-lock.json')
          const v = l.packages['node_modules/vitest']?.version
          console.log('resolved vitest:', v)
          const [major, minor, patch] = String(v || '').split('.').map(Number)
          if (major !== 4 || minor < 1 || (minor === 1 && patch < 10)) process.exit(1)
          NODE
      - name: Security audit after refresh
        run: npm audit --json || true
      - name: Commit generated lockfile to this security branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: refresh lockfile for Vitest security upgrade'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
