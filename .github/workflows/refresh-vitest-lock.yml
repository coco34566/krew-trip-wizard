name: Refresh Vitest lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate patched Vitest resolution
        run: |
          node -e "const l=require('./package-lock.json'); const v=l.packages['node_modules/vitest']?.version; console.log('resolved vitest:',v); if (!v || v !== '4.1.10') process.exit(1)"
      - name: Emit compressed lockfile for review
        run: gzip -9c package-lock.json | base64 -w 0
