name: Finalize planning timing and activity cost fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-planning-times-activity-costs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reuse validated targeted patch
        run: |
          python - <<'PY'
          import base64, re
          from pathlib import Path
          workflow = Path('.github/workflows/fix-planning-times-activity-costs.yml').read_text()
          match = re.search(r"base64\.b64decode\('([^']+)'\)", workflow)
          if not match:
              raise SystemExit('embedded patch not found')
          exec(base64.b64decode(match.group(1)).decode())
          PY

      - name: Verify targeted changes
        run: |
          git diff --check
          grep -q 'outboundArrivalTime || pickArrival' 'src/routes/_authenticated/trips.$tripId.index.tsx'
          grep -q 'Activités : ~' 'src/routes/_authenticated/trips.$tripId.index.tsx'
          grep -q 'estimatedPriceFxRate' src/lib/krew/currency.server.ts
          grep -q 'estimationIsEur' src/lib/krew/cost-split.ts
          grep -q 'normalizeItineraryPricesToEur' src/lib/trips.functions.ts

      - name: Commit source patch and clean temporary workflows
        run: |
          git config user.name 'KREW fix bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/fix-planning-times-activity-costs.yml
          git rm .github/workflows/finalize-planning-times-activity-costs.yml
          git add src/lib/krew/currency.server.ts src/lib/krew/cost-split.ts src/lib/trips.functions.ts 'src/routes/_authenticated/trips.$tripId.index.tsx'
          git commit -m 'Fix planning transport times and activity costs'
          git push origin HEAD:main
