name: Add accommodation diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-accommodation-diagnostics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add accommodation diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/krew/accommodation-ai.server.ts')
          text = p.read_text()

          anchor1 = '''  const searchQuery = await generateTavilyQuery(specification, geminiKey);\n'''
          insert1 = '''  const searchQuery = await generateTavilyQuery(specification, geminiKey);\n  console.info("accommodation-search-input", {\n    model: process.env["GEMINI_MODEL"] || "gemini-3.6-flash",\n    query: searchQuery,\n    destination: specification.destination,\n    dates: specification.dates,\n    group: specification.group,\n    budget: specification.budget,\n    locationIntent: specification.locationIntent,\n    minimumRating: specification.minimumRating,\n    requiredAmenities: specification.requiredAmenities,\n    accessibilityRequired: specification.accessibilityRequired,\n    searchStrategies: specification.searchStrategies.map((strategy) => ({\n      concept: strategy.concept,\n      score: strategy.score,\n      priority: strategy.priority,\n      propertyTypes: strategy.propertyTypes,\n      mustHave: strategy.mustHave,\n      preferred: strategy.preferred,\n    })),\n  });\n'''
          if text.count(anchor1) != 1:
              raise SystemExit(f'Expected one searchQuery anchor, found {text.count(anchor1)}')
          text = text.replace(anchor1, insert1, 1)

          anchor2 = '''  return normalizeTavilyAccommodationResults(payload, specification);\n}'''
          insert2 = '''  const normalized = normalizeTavilyAccommodationResults(payload, specification);\n  console.info("accommodation-search-output", {\n    destination: specification.destination.name,\n    rawResultCount,\n    normalizedResultCount: normalized.length,\n    webSearchCalls,\n    tavilyCredits,\n  });\n  return normalized;\n}'''
          if text.count(anchor2) != 1:
              raise SystemExit(f'Expected one final normalizer return, found {text.count(anchor2)}')
          text = text.replace(anchor2, insert2, 1)
          p.write_text(text)
          PY

      - name: Verify targeted diff
        run: |
          git diff --check
          git diff -- src/lib/krew/accommodation-ai.server.ts
          grep -q 'accommodation-search-input' src/lib/krew/accommodation-ai.server.ts
          grep -q 'accommodation-search-output' src/lib/krew/accommodation-ai.server.ts

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'KREW fix bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/add-accommodation-diagnostics.yml
          git add src/lib/krew/accommodation-ai.server.ts
          git commit -m 'Instrument accommodation search diagnostics'
          git push origin HEAD:main
