name: Fix group trip duration source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace participant duration averaging
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/lib/availability.functions.ts')
          text = path.read_text()

          replacements = [
            (
              '      supabase.from("trip_preferences").select("duration_nights").eq("trip_id", data.tripId).maybeSingle(),\n',
              '',
            ),
            (
              '    const nights = Number(prefs.data?.duration_nights ?? trip.data.duration_nights ?? 2) || 2;\n',
              '    // The duration entered when creating the trip is the group-wide source of truth.\n    // trip_availability.duration_nights is retained only for backward compatibility.\n    const tripDurationNights = Number((trip.data as any).duration_nights);\n    const nights = Number.isFinite(tripDurationNights) ? Math.max(0, tripDurationNights) : 2;\n',
            ),
            (
              '    // Calcul optimal de la durée du séjour pour le groupe\n    const submittedNights = (rows.data ?? []).map((r: any) => Number(r.duration_nights)).filter((n) => n > 0);\n    const optNights = submittedNights.length > 0\n      ? Math.round(submittedNights.reduce((a, b) => a + b, 0) / submittedNights.length)\n      : nights;\n\n    const windowsRaw = rankDateWindows(entries, optNights, 5);\n',
              '    const windowsRaw = rankDateWindows(entries, nights, 5);\n',
            ),
            (
              '      const nights = Number(trip.data.duration_nights ?? 2) || 2;\n      const submittedNights = all.data.map((r: any) => Number(r.duration_nights)).filter((n) => n > 0);\n      const optNights = submittedNights.length > 0\n        ? Math.round(submittedNights.reduce((a, b) => a + b, 0) / submittedNights.length)\n        : nights;\n      const windows = rankDateWindows(entries, optNights, 3);\n',
              '      // Always use the trip creation duration for group date proposals.\n      // Individual availability durations are stored for compatibility only.\n      const tripDurationNights = Number((trip.data as any).duration_nights);\n      const nights = Number.isFinite(tripDurationNights) ? Math.max(0, tripDurationNights) : 2;\n      const windows = rankDateWindows(entries, nights, 3);\n',
            ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source block not found: {old[:80]!r}')
              text = text.replace(old, new, 1)

          if 'submittedNights' in text:
              raise SystemExit('Participant duration averaging still exists')
          path.write_text(text)

      - name: Verify source
        run: |
          test "$(grep -c 'rankDateWindows(entries, nights,' src/lib/availability.functions.ts)" -eq 2
          ! grep -q 'submittedNights' src/lib/availability.functions.ts

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/availability.functions.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix group trip date duration"
          git push
