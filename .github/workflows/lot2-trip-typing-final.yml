name: Lot 2 final strict typing

on:
  push:
    branches: [fix/privacy-trip-typing-audits]
    paths: [.github/workflows/lot2-trip-typing-final.yml]

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/privacy-trip-typing-audits
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Capture pre-fix TypeScript snapshot
        run: npx tsc --noEmit --pretty false > /tmp/tsc-before-final.log 2>&1 || true

      - name: Give persisted JSON precise local shapes
        run: |
          python3 <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); s=p.read_text(); assert old in s, path; p.write_text(s.replace(old,new))

          # Live mode: JSON is persisted itinerary data; assert only the fields this view reads.
          p=Path('src/components/krew/TripLiveModePanel.tsx'); s=p.read_text()
          anchor='type Props = {'
          insert='''type LiveItineraryDay = {\n  day?: unknown;\n  title?: string;\n  slots?: any[];\n};\n\n'''
          if insert not in s:
              assert anchor in s; s=s.replace(anchor, insert+anchor)
          s=s.replace('const days = Array.isArray(itinerary.days) ? itinerary.days : [];', 'const days = Array.isArray(itinerary["days"]) ? (itinerary["days"] as unknown as LiveItineraryDay[]) : [];')
          p.write_text(s)

          # Packing: only slot labels are consumed from itinerary days.
          p=Path('src/components/krew/TripPackingPage.tsx'); s=p.read_text()
          marker='export function TripPackingPage'
          alias='''type PackingItineraryDay = { slots?: any[] };\n\n'''
          if alias not in s:
              assert marker in s; s=s.replace(marker, alias+marker)
          s=s.replace('const itineraryDays = Array.isArray(itinerary.days) ? itinerary.days : [];', 'const itineraryDays = Array.isArray(itinerary["days"]) ? (itinerary["days"] as unknown as PackingItineraryDay[]) : [];')
          p.write_text(s)

          # Planning: persistently stored itinerary contract used by this page.
          p=Path('src/components/krew/TripPlanningPage.tsx'); s=p.read_text()
          marker='export function planningTypeLabel'
          alias='''type PlanningItineraryDay = {\n  day: number;\n  date?: string;\n  slots?: any[];\n};\n\n'''
          if alias not in s:
              assert marker in s; s=s.replace(marker, alias+marker)
          s=s.replace('const days = Array.isArray(itinerary.days) ? itinerary.days : [];', 'const days = Array.isArray(itinerary["days"]) ? (itinerary["days"] as unknown as PlanningItineraryDay[]) : [];')
          s=s.replace('const destination = String(itinerary.destination || logistics.destination || "").trim();', 'const destination = String(itinerary["destination"] || logistics["destination"] || "").trim();')
          p.write_text(s)

          # Tasks only needs to know whether persisted itinerary has days.
          rep('src/components/krew/TripTasksPage.tsx', 'const hasItinerary = Array.isArray(itinerary.days) && itinerary.days.length > 0;', 'const hasItinerary = Array.isArray(itinerary["days"]) && itinerary["days"].length > 0;')

          # Destination reads one legacy key from the persisted logistics JSON.
          rep('src/components/krew/TripDestinationPage.tsx', 'const noAdmissibleProposals = logistics.destinationGenerationState === "no_admissible_proposals";', 'const noAdmissibleProposals = logistics["destinationGenerationState"] === "no_admissible_proposals";')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/krew/TripLiveModePanel.tsx src/components/krew/TripPackingPage.tsx src/components/krew/TripPlanningPage.tsx src/components/krew/TripTasksPage.tsx src/components/krew/TripDestinationPage.tsx
          git commit -m 'refactor(types): type persisted trip JSON shapes'
          git push origin HEAD:fix/privacy-trip-typing-audits

      - name: Fix stale generated-schema query inference
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/lib/trips.functions.ts'); s=p.read_text()
          old='.select("owner_id, co_organizer_id, stay_concepts_calculated")'
          assert old in s
          s=s.replace(old, '.select("*")', 1)
          p.write_text(s)
          PY
          git add src/lib/trips.functions.ts
          git commit -m 'refactor(types): avoid invalid trip select inference'
          git push origin HEAD:fix/privacy-trip-typing-audits

      - name: Verify targeted any removal
        run: |
          if grep -R -n -E 'trip: any|data\.trip as any' src --include='*.ts' --include='*.tsx'; then
            echo 'Targeted trip any usages remain' >&2
            exit 1
          fi

      - name: Capture final TypeScript snapshot
        run: npx tsc --noEmit --pretty false > /tmp/tsc-after-final.log 2>&1 || true

      - name: Require no new semantic TypeScript errors
        run: |
          set -o pipefail
          python3 <<'PY' | tee /tmp/tsc-final-delta.txt
          import re
          from collections import Counter
          from pathlib import Path
          def errors(path):
              lines=[x.strip() for x in Path(path).read_text().splitlines() if re.search(r'\berror TS\d+:',x)]
              return [re.sub(r'^(.*?)(?:\(\d+,\d+\))(: error TS\d+:)',r'\1\2',x) for x in lines]
          b=Counter(errors('/tmp/tsc-before-final.log')); a=Counter(errors('/tmp/tsc-after-final.log'))
          added=list((a-b).elements()); removed=list((b-a).elements())
          print(f'before_final={sum(b.values())}'); print(f'after_final={sum(a.values())}')
          print(f'added={len(added)}'); [print('ADD '+x) for x in sorted(added)]
          print(f'removed={len(removed)}'); [print('REMOVE '+x) for x in sorted(removed)]
          if added: raise SystemExit(1)
          PY

      - name: Run unit tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot2-final-validation
          path: |
            /tmp/tsc-before-final.log
            /tmp/tsc-after-final.log
            /tmp/tsc-final-delta.txt
