name: Lot 2 final strict typing

on:
  push:
    branches: [fix/privacy-trip-typing-audits]
    paths: [.github/workflows/lot2-trip-typing-final.yml]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/privacy-trip-typing-audits
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify targeted any removal
        run: |
          if grep -R -n -E 'trip: any|data\.trip as any' src --include='*.ts' --include='*.tsx'; then
            echo 'Targeted trip any usages remain' >&2
            exit 1
          fi
      - name: Capture TypeScript snapshot
        run: npx tsc --noEmit --pretty false > /tmp/tsc-after-final.log 2>&1 || true
      - name: Run unit tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot2-final-contract-validation
          path: /tmp/tsc-after-final.log
