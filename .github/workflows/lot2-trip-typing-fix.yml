name: Lot 2 strict typing fixes

on:
  push:
    branches: [fix/privacy-trip-typing-audits]
    paths: [.github/workflows/lot2-trip-typing-fix.yml]

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/privacy-trip-typing-audits
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Capture pre-fix TypeScript snapshot
        run: npx tsc --noEmit --pretty false > /tmp/tsc-before-fix.log 2>&1 || true

      - name: Correct domain helper contracts
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('src/lib/krew/engine-legacy.ts')
          s = p.read_text()
          old = 'export function isTripAdmin(trip: Tables<"trips"> | null | undefined, userId: string): boolean {'
          new = '''export type TripAdminLike = Partial<Pick<Tables<"trips">, "id" | "owner_id" | "co_organizer_id">> & {\n  ownerId?: string | null;\n  coOrganizerId?: string | null;\n};\n\nexport function isTripAdmin(trip: TripAdminLike | null | undefined, userId: string): boolean {'''
          assert old in s
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('src/lib/krew/trip-service-legacy.ts')
          s = p.read_text()
          old = 'export function getEffectiveParticipantsCount(trip: Tables<"trips"> | null | undefined, participants: any[]): number {'
          new = 'export function getEffectiveParticipantsCount(trip: Pick<Tables<"trips">, "participants_count"> | null | undefined, participants: any[]): number {'
          assert old in s
          s = s.replace(old, new)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/krew/engine-legacy.ts src/lib/krew/trip-service-legacy.ts
          git commit -m 'refactor(types): narrow trip helper contracts'
          git push origin HEAD:fix/privacy-trip-typing-audits

      - name: Correct JSON and generated-field access
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              assert old in s, path
              p.write_text(s.replace(old, new))

          replace(
            'src/components/krew/TripLiveModePanel.tsx',
            '''  const datesLocked = Boolean(trip?.dates_locked || trip?.datesLocked);''',
            '''  const datesLocked = Boolean(trip.dates_locked);''',
          )
          replace(
            'src/components/krew/TripLiveModePanel.tsx',
            '''  const dayNumber = tripDayNumber(trip?.start_date, now);\n  const days = Array.isArray(trip?.group_itinerary?.days) ? trip.group_itinerary.days : [];''',
            '''  const dayNumber = tripDayNumber(trip.start_date, now);\n  const rawItinerary = trip.group_itinerary;\n  const itinerary =\n    rawItinerary && typeof rawItinerary === "object" && !Array.isArray(rawItinerary)\n      ? rawItinerary\n      : {};\n  const days = Array.isArray(itinerary.days) ? itinerary.days : [];''',
          )

          replace(
            'src/components/krew/TripPackingPage.tsx',
            '''  const logistics = (trip.group_logistics ?? {}) as any;\n  const activities = (data.activities ?? []) as any[];\n  const itineraryDays = (trip.group_itinerary?.days ?? []) as any[];''',
            '''  const logistics = (trip.group_logistics ?? {}) as any;\n  const activities = (data.activities ?? []) as any[];\n  const rawItinerary = trip.group_itinerary;\n  const itinerary =\n    rawItinerary && typeof rawItinerary === "object" && !Array.isArray(rawItinerary)\n      ? rawItinerary\n      : {};\n  const itineraryDays = Array.isArray(itinerary.days) ? itinerary.days : [];''',
          )

          replace(
            'src/components/krew/TripPlanningPage.tsx',
            '''      datesLocked: Boolean(trip.dates_locked ?? trip.datesLocked),''',
            '''      datesLocked: Boolean(trip.dates_locked),''',
          )
          replace(
            'src/components/krew/TripPlanningPage.tsx',
            '''  const days = (trip.group_itinerary?.days ?? []) as any[];\n  const destination = String(\n    trip.group_itinerary?.destination || trip.group_logistics?.destination || "",\n  ).trim();''',
            '''  const rawItinerary = trip.group_itinerary;\n  const itinerary =\n    rawItinerary && typeof rawItinerary === "object" && !Array.isArray(rawItinerary)\n      ? rawItinerary\n      : {};\n  const rawLogistics = trip.group_logistics;\n  const logistics =\n    rawLogistics && typeof rawLogistics === "object" && !Array.isArray(rawLogistics)\n      ? rawLogistics\n      : {};\n  const days = Array.isArray(itinerary.days) ? itinerary.days : [];\n  const destination = String(itinerary.destination || logistics.destination || "").trim();''',
          )

          replace(
            'src/components/krew/TripTasksPage.tsx',
            '''      datesLocked: Boolean(trip.dates_locked ?? trip.datesLocked),''',
            '''      datesLocked: Boolean(trip.dates_locked),''',
          )
          replace(
            'src/components/krew/TripTasksPage.tsx',
            '''  const tasks = tasksQuery.data ?? [];\n  const hasItinerary = Boolean(trip.group_itinerary?.days?.length);''',
            '''  const tasks = tasksQuery.data ?? [];\n  const rawItinerary = trip.group_itinerary;\n  const itinerary =\n    rawItinerary && typeof rawItinerary === "object" && !Array.isArray(rawItinerary)\n      ? rawItinerary\n      : {};\n  const hasItinerary = Array.isArray(itinerary.days) && itinerary.days.length > 0;''',
          )

          replace(
            'src/components/krew/TripDestinationPage.tsx',
            '''  const noAdmissibleProposals = trip?.group_logistics?.destinationGenerationState === "no_admissible_proposals";''',
            '''  const rawLogistics = trip.group_logistics;\n  const logistics =\n    rawLogistics && typeof rawLogistics === "object" && !Array.isArray(rawLogistics)\n      ? rawLogistics\n      : {};\n  const noAdmissibleProposals = logistics.destinationGenerationState === "no_admissible_proposals";''',
          )

          replace(
            'src/components/krew/TripAccommodationPage.tsx',
            '''        (trip.co_organizer_id === data.userId || trip.coOrganizerId === data.userId)),''',
            '''        trip.co_organizer_id === data.userId),''',
          )
          PY
          git add src/components/krew/TripLiveModePanel.tsx src/components/krew/TripPackingPage.tsx src/components/krew/TripPlanningPage.tsx src/components/krew/TripTasksPage.tsx src/components/krew/TripDestinationPage.tsx src/components/krew/TripAccommodationPage.tsx
          git commit -m 'refactor(types): normalize typed trip field access'
          git push origin HEAD:fix/privacy-trip-typing-audits

      - name: Verify targeted any removal
        run: |
          if grep -R -n -E 'trip: any|data\.trip as any' src --include='*.ts' --include='*.tsx'; then
            echo 'Targeted trip any usages remain' >&2
            exit 1
          fi

      - name: Capture final TypeScript snapshot
        run: npx tsc --noEmit --pretty false > /tmp/tsc-after-fix.log 2>&1 || true

      - name: Ensure fixes add no semantic TypeScript errors
        run: |
          set -o pipefail
          python3 <<'PY' | tee /tmp/tsc-fix-delta.txt
          import re
          from collections import Counter
          from pathlib import Path
          def errors(path):
              lines = [line.strip() for line in Path(path).read_text().splitlines() if re.search(r'\berror TS\d+:', line)]
              return [re.sub(r'^(.*?)(?:\(\d+,\d+\))(: error TS\d+:)', r'\1\2', line) for line in lines]
          before = Counter(errors('/tmp/tsc-before-fix.log'))
          after = Counter(errors('/tmp/tsc-after-fix.log'))
          added = list((after - before).elements())
          removed = list((before - after).elements())
          print(f'before_fix={sum(before.values())}')
          print(f'after_fix={sum(after.values())}')
          print(f'added={len(added)}')
          for line in sorted(added): print('ADD ' + line)
          print(f'removed={len(removed)}')
          for line in sorted(removed): print('REMOVE ' + line)
          if added:
              raise SystemExit(1)
          PY

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot2-strict-typing-fix-validation
          path: |
            /tmp/tsc-before-fix.log
            /tmp/tsc-after-fix.log
            /tmp/tsc-fix-delta.txt
