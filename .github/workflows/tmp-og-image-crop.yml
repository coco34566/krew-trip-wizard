name: Temporary OG image crop

on:
  push:
    branches:
      - feat/social-share-previews
    paths:
      - .github/workflows/tmp-og-image-crop.yml

permissions:
  contents: write

jobs:
  crop:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/social-share-previews
      - name: Crop hero to 1200x630
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path("src/assets/hero-krew.jpg")
          dst = Path("public/brand/og-default.jpg")

          img = Image.open(src).convert("RGB")
          target_ratio = 1200 / 630
          ratio = img.width / img.height

          if ratio > target_ratio:
              new_width = round(img.height * target_ratio)
              left = (img.width - new_width) // 2
              img = img.crop((left, 0, left + new_width, img.height))
          else:
              new_height = round(img.width / target_ratio)
              top = (img.height - new_height) // 2
              img = img.crop((0, top, img.width, top + new_height))

          img = img.resize((1200, 630), Image.Resampling.LANCZOS)
          img.save(dst, "JPEG", quality=88, optimize=True, progressive=True)
          print("saved", dst, img.size)
          PY
      - name: Commit cropped image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand/og-default.jpg
          git commit -m "fix(meta): crop social image to 1200x630"
          git push origin HEAD:feat/social-share-previews
