name: Memories Phase 5 final contracts

on:
  push:
    branches: [automation/memories-phase5-final]
    paths:
      - .github/workflows/one-shot-memories-phase5-final.yml
      - .github/scripts/memories-phase5.sh
      - .github/scripts/memories-phase5-fix.py

permissions:
  contents: write

jobs:
  phase5:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/memories-architecture-phased
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply and validate Phase 5
        run: |
          curl -fsSL https://raw.githubusercontent.com/coco34566/krew-trip-wizard/automation/memories-phase5-final/.github/scripts/memories-phase5.sh -o /tmp/memories-phase5.sh
          curl -fsSL https://raw.githubusercontent.com/coco34566/krew-trip-wizard/automation/memories-phase5-final/.github/scripts/memories-phase5-fix.py -o /tmp/memories-phase5-fix.py
          python3 /tmp/memories-phase5-fix.py
          bash /tmp/memories-phase5.sh
