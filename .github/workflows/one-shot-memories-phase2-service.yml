name: Memories Phase 2 service extraction

on:
  push:
    branches: [automation/memories-phase2-service-v2]
    paths: [.github/workflows/one-shot-memories-phase2-service.yml]

permissions:
  contents: write

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/memories-architecture-phased
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Capture pre-phase TypeScript baseline
        run: npx tsc --noEmit --pretty false > /tmp/tsc-before.log 2>&1 || true

      - name: Extract Memories data layer without behavior changes
        run: |
          cat > src/lib/memories-service.ts <<'EOF'
          import { supabase } from "@/integrations/supabase/client";

          export type Photo = {
            id: string;
            trip_id: string;
            url: string;
            author: string;
            likes: number;
            likedByMe: boolean;
            created_at: string;
            storage_path?: string | null;
            owner_user_id?: string | null;
            original_filename?: string | null;
          };

          async function signPhotoUrls(rows: any[]): Promise<Photo[]> {
            const photos = rows.map((row) => {
              const photo = {
                ...row,
                likedByMe: Array.isArray(row.trip_photo_likes) && row.trip_photo_likes.length > 0,
              };
              delete photo.trip_photo_likes;
              return photo;
            });
            const paths = photos
              .map((photo) => photo.storage_path)
              .filter((path): path is string => Boolean(path));
            if (!paths.length) {
              return photos.map((photo) => ({ ...photo, url: photo.url || "" })) as Photo[];
            }
            const { data, error } = await supabase.storage.from("trip-photos").createSignedUrls(paths, 3600);
            if (error) throw error;
            const signedByPath = new Map<string, string>();
            for (let i = 0; i < (data || []).length; i++) {
              const item = (data || [])[i] as any;
              if (item?.error) throw new Error(String(item.error));
              const path = item?.path || paths[i];
              if (path && item?.signedUrl) signedByPath.set(path, item.signedUrl);
            }
            return photos.map((photo) =>
              photo.storage_path
                ? { ...photo, url: signedByPath.get(photo.storage_path) || "" }
                : { ...photo, url: photo.url || "" },
            ) as Photo[];
          }

          export async function getMemoriesViewer(tripId: string) {
            const {
              data: { user },
            } = await supabase.auth.getUser();
            if (!user) return null;
            const { data } = await supabase
              .from("trip_participants")
              .select("display_name")
              .eq("trip_id", tripId)
              .eq("user_id", user.id)
              .maybeSingle();
            return { userId: user.id, userName: data?.display_name || "Moi" };
          }

          export async function listTripPhotos(tripId: string): Promise<Photo[]> {
            const { data, error } = await supabase
              .from("trip_photos" as any)
              .select("*, trip_photo_likes(user_id)")
              .eq("trip_id", tripId)
              .is("deleted_at", null)
              .order("created_at", { ascending: false });
            if (error) throw error;
            return signPhotoUrls(data || []);
          }

          export async function getMemoriesRecapSource(tripId: string) {
            const [tripResult, recoResult] = await Promise.all([
              supabase
                .from("trips")
                .select(
                  "id,name,start_date,end_date,participants_count,selected_activity_ids,group_itinerary,group_logistics",
                )
                .eq("id", tripId)
                .single(),
              supabase
                .from("recommendations")
                .select("destinations(name,country)")
                .eq("trip_id", tripId)
                .eq("is_selected", true)
                .maybeSingle(),
            ]);
            if (tripResult.error) throw tripResult.error;
            if (recoResult.error) throw recoResult.error;
            const rawDestination = (recoResult.data as any)?.destinations;
            const destination = Array.isArray(rawDestination)
              ? (rawDestination[0] ?? null)
              : (rawDestination ?? null);
            return { trip: tripResult.data as any, destination };
          }

          export async function toggleTripPhotoLike(photoId: string) {
            const { error } = await supabase.rpc("toggle_trip_photo_like" as any, {
              p_photo_id: photoId,
            });
            if (error) throw error;
          }

          export async function removeTripPhoto(photo: Photo) {
            if (photo.storage_path) {
              const { error } = await supabase.storage.from("trip-photos").remove([photo.storage_path]);
              if (error) throw error;
            }
            const { error } = await supabase
              .from("trip_photos" as any)
              .update({ deleted_at: new Date().toISOString() })
              .eq("id", photo.id);
            if (error) throw error;
          }

          export async function uploadTripPhoto({
            tripId,
            userId,
            userName,
            file,
            hash,
          }: {
            tripId: string;
            userId: string;
            userName: string;
            file: File;
            hash: string;
          }): Promise<{ duplicate: boolean }> {
            const { data: duplicate, error: duplicateError } = await supabase
              .from("trip_photos" as any)
              .select("id")
              .eq("trip_id", tripId)
              .eq("content_hash", hash)
              .is("deleted_at", null)
              .maybeSingle();
            if (duplicateError) throw duplicateError;
            if (duplicate) return { duplicate: true };

            const id = crypto.randomUUID();
            const ext =
              file.name
                .split(".")
                .pop()
                ?.toLowerCase()
                .replace(/[^a-z0-9]/g, "") || "jpg";
            const path = `${tripId}/${userId}/${id}.${ext}`;
            const { error: uploadError } = await supabase.storage
              .from("trip-photos")
              .upload(path, file, { contentType: file.type, upsert: false });
            if (uploadError) throw uploadError;

            const { error: insertError } = await supabase.from("trip_photos" as any).insert({
              id,
              trip_id: tripId,
              owner_user_id: userId,
              storage_path: path,
              author: userName,
              likes: 0,
              content_hash: hash,
              original_filename: file.name,
              mime_type: file.type,
              file_size_bytes: file.size,
            });
            if (insertError) {
              await supabase.storage.from("trip-photos").remove([path]);
              throw insertError;
            }
            return { duplicate: false };
          }
          EOF

          python3 <<'PY'
          from pathlib import Path
          p = Path('src/routes/_authenticated/trips.$tripId.memories.tsx')
          s = p.read_text()

          s = s.replace('import { supabase } from "@/integrations/supabase/client";\n', '')
          marker = 'import { createPhotosZip } from "@/lib/souvenirs-download";\n'
          service_import = '''import {\n  getMemoriesRecapSource,\n  getMemoriesViewer,\n  listTripPhotos,\n  removeTripPhoto,\n  toggleTripPhotoLike,\n  uploadTripPhoto,\n  type Photo,\n} from "@/lib/memories-service";\n'''
          assert marker in s
          s = s.replace(marker, marker + service_import, 1)

          type_start = s.index('type Photo = {')
          fn_start = s.index('function fileName(', type_start)
          s = s[:type_start] + s[fn_start:]

          old = '''    supabase.auth.getUser().then(({ data: { user } }) => {\n      if (!user) return;\n      setUserId(user.id);\n      supabase\n        .from("trip_participants")\n        .select("display_name")\n        .eq("trip_id", tripId)\n        .eq("user_id", user.id)\n        .maybeSingle()\n        .then(({ data }) => {\n          if (data?.display_name) setUserName(data.display_name);\n        });\n    });'''
          new = '''    getMemoriesViewer(tripId).then((viewer) => {\n      if (!viewer) return;\n      setUserId(viewer.userId);\n      if (viewer.userName !== "Moi") setUserName(viewer.userName);\n    });'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    queryFn: async () => {\n      const { data, error } = await supabase\n        .from("trip_photos" as any)\n        .select("*, trip_photo_likes(user_id)")\n        .eq("trip_id", tripId)\n        .is("deleted_at", null)\n        .order("created_at", { ascending: false });\n      if (error) throw error;\n      return signPhotoUrls(data || []);\n    },'''
          new = '''    queryFn: () => listTripPhotos(tripId),'''
          assert old in s
          s = s.replace(old, new, 1)

          qstart = s.index('  const { data: recapSource } = useQuery({')
          qend = s.index('  const recap = recapSource', qstart)
          oldblock = s[qstart:qend]
          newblock = '''  const { data: recapSource } = useQuery({\n    queryKey: ["trip-recap-source", tripId],\n    queryFn: () => getMemoriesRecapSource(tripId),\n    enabled: Boolean(tripId),\n    retry: false,\n  });\n'''
          s = s[:qstart] + newblock + s[qend:]

          old = '''    mutationFn: async (id: string) => {\n      const { error } = await supabase.rpc("toggle_trip_photo_like" as any, { p_photo_id: id });\n      if (error) throw error;\n    },'''
          new = '''    mutationFn: (id: string) => toggleTripPhotoLike(id),'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    mutationFn: async (p: Photo) => {\n      if (p.storage_path) {\n        const { error } = await supabase.storage.from("trip-photos").remove([p.storage_path]);\n        if (error) throw error;\n      }\n      const { error } = await supabase\n        .from("trip_photos" as any)\n        .update({ deleted_at: new Date().toISOString() })\n        .eq("id", p.id);\n      if (error) throw error;\n    },'''
          new = '''    mutationFn: (p: Photo) => removeTripPhoto(p),'''
          assert old in s
          s = s.replace(old, new, 1)

          start = s.index('        const hash = await sha256File(file);')
          end = s.index('        added++;', start) + len('        added++;')
          old = s[start:end]
          new = '''        const hash = await sha256File(file);\n        const result = await uploadTripPhoto({ tripId, userId, userName, file, hash });\n        if (result.duplicate) {\n          duplicates++;\n          continue;\n        }\n        added++;'''
          s = s[:start] + new + s[end:]
          p.write_text(s)
          PY

      - name: Enforce Phase 2 boundary
        run: |
          if grep -n 'supabase\.' 'src/routes/_authenticated/trips.$tripId.memories.tsx'; then
            echo 'Direct Supabase access remains in Memories route' >&2
            exit 1
          fi
          git diff --check
          changed="$(git diff --name-only)"
          echo "$changed"
          test "$changed" = $'src/lib/memories-service.ts\nsrc/routes/_authenticated/trips.$tripId.memories.tsx'

      - name: Run Memories characterization
        run: npx vitest run 'src/routes/_authenticated/__tests__/trips.$tripId.memories.characterization.test.tsx'

      - name: Run Phase 2 TypeScript check
        run: npx tsc --noEmit --pretty false > /tmp/tsc-after.log 2>&1 || true

      - name: Reject new semantic TypeScript errors
        run: |
          python3 <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          def errs(path):
              out=[]
              for line in Path(path).read_text().splitlines():
                  line=line.strip()
                  if re.search(r'\berror TS\d+:', line):
                      line=re.sub(r'^(.*?)(?:\(\d+,\d+\))(: error TS\d+:)', r'\1\2', line)
                      out.append(line)
              return Counter(out)
          before=errs('/tmp/tsc-before.log')
          after=errs('/tmp/tsc-after.log')
          added=list((after-before).elements())
          print(f'before={sum(before.values())} after={sum(after.values())} added={len(added)}')
          for line in sorted(added): print('ADD '+line)
          if added: raise SystemExit(1)
          PY

      - name: Build application
        run: npm run build

      - name: Commit Phase 2 only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/memories-service.ts 'src/routes/_authenticated/trips.$tripId.memories.tsx'
          git commit -m 'refactor(memories): extract Supabase data service'
          git push origin HEAD:refactor/memories-architecture-phased
