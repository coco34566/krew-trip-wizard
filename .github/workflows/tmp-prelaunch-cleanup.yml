name: Temporary prelaunch cleanup

on:
  push:
    branches:
      - chore/prelaunch-cleanup-join-firstname
    paths:
      - .github/workflows/tmp-prelaunch-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/prelaunch-cleanup-join-firstname
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply cleanup
        run: |
          python <<'PY'
          from pathlib import Path
          import json, shutil

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          join = Path("src/routes/join.$tripId.tsx")
          text = join.read_text()
          text = text.replace(
              'const JOIN_INPUT_CLASS =\n  "h-11 rounded-[10px] border-border/70 bg-background px-3 text-[15px] shadow-none transition-colors focus-visible:border-primary/55 focus-visible:ring-2 focus-visible:ring-primary/10";',
              'const JOIN_INPUT_CLASS =\n  "h-11 rounded-[10px] border-border/70 bg-background px-3 text-[15px] shadow-none transition-colors focus-visible:border-primary/55 focus-visible:ring-2 focus-visible:ring-primary/10";\n\nfunction joinFirstNameStorageKey(tripId: string) {\n  return `krew:join-firstname:${tripId}`;\n}'
          )
          marker = '  const [error, setError] = useState<string | null>(null);\n\n'
          restore = '''  const [error, setError] = useState<string | null>(null);\n\n  useEffect(() => {\n    if (!tripId || firstName) return;\n    try {\n      const storedFirstName = sessionStorage.getItem(joinFirstNameStorageKey(tripId));\n      if (storedFirstName) setFirstName(storedFirstName);\n    } catch {\n      // sessionStorage can be unavailable in restricted browser contexts.\n    }\n  }, [tripId, firstName]);\n\n'''
          if marker not in text:
              raise SystemExit("Join state marker not found")
          text = text.replace(marker, restore, 1)
          old = '''  async function handleJoin() {\n    if (!isAuthenticated) {\n      navigate({ to: "/auth", search: { next: authNext } as any });\n      return;\n    }'''
          new = '''  async function handleJoin() {\n    if (!isAuthenticated) {\n      try {\n        sessionStorage.setItem(joinFirstNameStorageKey(tripId), firstName);\n      } catch {\n        // The auth redirect must still work when storage is unavailable.\n      }\n      navigate({ to: "/auth", search: { next: authNext } as any });\n      return;\n    }'''
          if old not in text:
              raise SystemExit("Join unauthenticated handler marker not found")
          text = text.replace(old, new, 1)
          old = '''      const res = await doJoin({ data: { tripId, token, firstName: firstName.trim() } });\n      if (res?.alreadyMember'''
          new = '''      const res = await doJoin({ data: { tripId, token, firstName: firstName.trim() } });\n      try {\n        sessionStorage.removeItem(joinFirstNameStorageKey(tripId));\n      } catch {\n        // Joining succeeded; storage cleanup must not block navigation.\n      }\n      if (res?.alreadyMember'''
          if old not in text:
              raise SystemExit("Join success marker not found")
          text = text.replace(old, new, 1)
          join.write_text(text)

          design = Path("src/routes/design-system.tsx")
          text = design.read_text()
          text = text.replace(
              'import { createFileRoute } from "@tanstack/react-router";',
              'import { createFileRoute, notFound } from "@tanstack/react-router";',
              1,
          )
          old = 'export const Route=createFileRoute("/design-system")({component:DesignSystemPage});'
          new = '''export const Route=createFileRoute("/design-system")({\n  beforeLoad: () => {\n    if (import.meta.env.PROD) throw notFound();\n  },\n  head: () => ({\n    meta: [{ name: "robots", content: "noindex, nofollow" }],\n  }),\n  component:DesignSystemPage,\n});'''
          if old not in text:
              raise SystemExit("Design-system route marker not found")
          design.write_text(text.replace(old, new, 1))

          auth = Path("src/routes/auth.tsx")
          text = auth.read_text()
          old = '      { name: "twitter:card", content: "summary_large_image" },'
          new = '      { name: "twitter:card", content: "summary_large_image" },\n      { name: "robots", content: "noindex, nofollow" },'
          if old not in text:
              raise SystemExit("Auth head marker not found")
          auth.write_text(text.replace(old, new, 1))

          Path("public/robots.txt").write_text("""User-agent: *\nAllow: /\nDisallow: /design-system\nDisallow: /join/\nDisallow: /trips/\nDisallow: /auth\nDisallow: /api/\n""")

          vite = Path("vite.config.ts")
          text = vite.read_text()
          text = text.replace('import { mcpPlugin } from "@lovable.dev/mcp-js/stacks/tanstack/vite";\n', '')
          text = text.replace('    plugins: [mcpPlugin()],\n', '')
          vite.write_text(text)

          pkg = Path("package.json")
          data = json.loads(pkg.read_text())
          data["dependencies"].pop("@lovable.dev/mcp-js", None)
          pkg.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")

          bunfig = Path("bunfig.toml")
          text = bunfig.read_text()
          text = text.replace('"@lovable.dev/mcp-js", ', '')
          bunfig.write_text(text)

          for file_path in [
              "src/routes/mcp.ts",
              "src/routes/[.]lovable.oauth.consent.tsx",
              "src/routes/[.well-known]/oauth-protected-resource.ts",
          ]:
              Path(file_path).unlink(missing_ok=True)
          for dir_path in ["src/routes/[.mcp]", "src/lib/mcp"]:
              shutil.rmtree(dir_path, ignore_errors=True)

          spec = Path("tests/e2e/join-visual-audit.spec.ts")
          text = spec.read_text()
          marker = '''  await expect(page.getByRole("heading", { name: /JOIN-VISUAL-AUDIT-/i }).first()).toBeVisible({\n    timeout: 20_000,\n  });\n\n  const invalidToken'''
          insert = '''  await expect(page.getByRole("heading", { name: /JOIN-VISUAL-AUDIT-/i }).first()).toBeVisible({\n    timeout: 20_000,\n  });\n\n  const persistedFirstName = "Léa QA";\n  const firstNameStorageKey = `krew:join-firstname:${tripId}`;\n  await page.locator("#join-firstname").fill(persistedFirstName);\n  await Promise.all([\n    page.waitForURL(/\\/auth(?:\\?|$)/, { timeout: 20_000 }),\n    userClick(\n      page,\n      page.getByRole("button", { name: "Se connecter pour rejoindre le voyage" }),\n      "redirect anonymous invitee to auth",\n    ),\n  ]);\n  await expect.poll(() => page.evaluate((key) => sessionStorage.getItem(key), firstNameStorageKey)).toBe(persistedFirstName);\n  await page.goBack();\n  await settleJoin(page);\n  await expect(page.locator("#join-firstname")).toHaveValue(persistedFirstName);\n  await page.evaluate((key) => sessionStorage.removeItem(key), firstNameStorageKey);\n\n  const invalidToken'''
          if marker not in text:
              raise SystemExit("Join visual test insertion marker not found")
          spec.write_text(text.replace(marker, insert, 1))
          PY

          npm install --package-lock-only --ignore-scripts
          bun install --lockfile-only
          npm ci
          npm run build

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve join name and clean prelaunch routes"
          git push origin HEAD:chore/prelaunch-cleanup-join-firstname


# retry
