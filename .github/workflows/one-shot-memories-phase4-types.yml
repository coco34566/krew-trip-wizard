name: Memories Phase 4 typed service

on:
  push:
    branches: [automation/memories-phase4-types]
    paths:
      - .github/workflows/one-shot-memories-phase4-types.yml
      - .github/scripts/memories-phase4.sh
      - .github/scripts/memories-phase4-fix.py

permissions:
  contents: write

jobs:
  phase4:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/memories-architecture-phased
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Phase 4 extraction and validation
        run: |
          curl -fsSL https://raw.githubusercontent.com/coco34566/krew-trip-wizard/automation/memories-phase4-types/.github/scripts/memories-phase4.sh -o /tmp/memories-phase4.sh
          curl -fsSL https://raw.githubusercontent.com/coco34566/krew-trip-wizard/automation/memories-phase4-types/.github/scripts/memories-phase4-fix.py -o /tmp/memories-phase4-fix.py
          python3 /tmp/memories-phase4-fix.py
          bash /tmp/memories-phase4.sh
