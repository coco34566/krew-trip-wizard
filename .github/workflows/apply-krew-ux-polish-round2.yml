name: Apply KREW UX polish round 2

on:
  push:
    branches:
      - ops/krew-ux-polish-round2-applier

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/krew-ux-polish-round-2
          fetch-depth: 0
      - name: Apply targeted UX corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def must_replace(text, old, new, label, count=1):
              actual = text.count(old)
              if actual != count: raise SystemExit(f"{label}: expected {count}, found {actual}")
              return text.replace(old, new, count)

          p='src/routes/index.tsx'; s=read(p)
          s=must_replace(s,'<KrewNote variant="tape" tone="cream" rotation={-1} size="sm" className="w-fit text-sm pointer-events-none">Le plan prend forme ici</KrewNote>','<KrewNote variant="tape" tone="sage" rotation={-1} size="sm" className="w-fit text-sm pointer-events-none">Le plan prend forme ici</KrewNote>','landing post-it'); write(p,s)

          p='src/components/krew/TripHubDashboard.tsx'; s=read(p)
          s=must_replace(s,'<div className="mx-0 my-4 sm:my-6 overflow-hidden relative space-y-3">','<div className="mx-0 mt-2 mb-4 sm:mt-3 sm:mb-5 overflow-hidden relative space-y-3">','dashboard KPI spacing'); write(p,s)

          p='src/components/krew/KrewJourneyTimeline.tsx'; s=read(p)
          s=must_replace(s,'<KrewNote variant="label" tone="plum" rotation={-1} className="w-fit text-[13px]">\n          Prochaine étape\n        </KrewNote>','<KrewNote variant="tape" tone="sage" rotation={-1} size="sm" className="w-fit text-[13px]">\n          Prochaine étape\n        </KrewNote>','timeline next post-it'); write(p,s)

          p='src/routes/_authenticated/trips.$tripId.availability.tsx'; s=read(p)
          s=must_replace(s,'<KrewNote variant="label" tone="cream" rotation={-1} className="inline-block px-3 py-1.5 text-[14px]">','<KrewNote variant="tape" tone="sage" rotation={-1} size="sm" className="inline-block px-3 py-1.5 text-[14px]">','availability missing answers note')
          s=must_replace(s,'<section className="w-full space-y-6">','<section className="w-full space-y-7">','availability rhythm')
          s=must_replace(s,'<div className="flex flex-wrap gap-2" role="group" aria-label="Mode de sélection des dates">','<div className="flex flex-wrap gap-2 pt-1" role="group" aria-label="Mode de sélection des dates">','availability mode spacing')
          s=s.replace('<KrewNote variant="tape" tone="cream" rotation={-1} className="inline-block px-3 py-1.5 text-[14px]">On cherche le bon créneau</KrewNote>','<KrewNote variant="tape" tone="sage" rotation={-1} size="sm" className="inline-block px-3 py-1.5 text-[14px]">On cherche le bon créneau</KrewNote>'); write(p,s)

          p='src/components/krew/TransportTimePrefsCard.tsx'; s=read(p)
          start=s.index('  return (\n    <div className="space-y-5">'); end=s.index('\n  );\n}',start)+len('\n  );')
          compact='''  return (\n    <section className="space-y-3 border-y border-border/45 py-4">\n      <div className="flex flex-col gap-1 sm:flex-row sm:items-baseline sm:justify-between sm:gap-4">\n        <div className="flex items-center gap-2"><KrewIcon name="time" tone="plum" size="sm" className="size-4 shrink-0" /><h3 className="font-display text-[19px] font-normal text-foreground">Mes créneaux</h3></div>\n        <p className="text-[12px] leading-relaxed text-muted-foreground">Les deux horaires utiles pour chercher tes trajets.</p>\n      </div>\n      <div className="grid gap-3 sm:grid-cols-[minmax(0,1fr)_minmax(0,1fr)_auto] sm:items-end">\n        <label className="space-y-1.5"><span className="block text-[12px] font-semibold text-foreground">Aller · disponible dès</span><Input type="time" className="h-9 min-h-9 rounded-[9px] border-border/55 text-sm font-mono" value={earliest} onChange={(e) => setEarliest(e.target.value)} /></label>\n        <label className="space-y-1.5"><span className="block text-[12px] font-semibold text-foreground">Retour · rentré avant</span><Input type="time" className="h-9 min-h-9 rounded-[9px] border-border/55 text-sm font-mono" value={latest} onChange={(e) => setLatest(e.target.value)} /></label>\n        <Button size="sm" onClick={() => saveMutation.mutate()} disabled={saveMutation.isPending || isMyPrefsLoading} className="w-full sm:w-auto">{saveMutation.isPending ? <Loader2 className="size-4 animate-spin" /> : <KrewIcon name="check" tone="plum" size="sm" className="size-4" />}Enregistrer</Button>\n      </div>\n    </section>\n  );'''
          s=s[:start]+compact+s[end:]; write(p,s)

          p='src/routes/_authenticated/trips.new.tsx'; s=read(p)
          s=must_replace(s,'<main className="mx-auto max-w-[820px] px-4 sm:px-6 py-6 sm:py-8 space-y-6 sm:space-y-8">','<main className="mx-auto max-w-[820px] px-5 sm:px-7 py-6 sm:py-8 space-y-6 sm:space-y-8">','new trip gutters')
          s=must_replace(s,'<form onSubmit={onSubmit} className="pt-2">','<form onSubmit={onSubmit} className="space-y-8 pt-2">','new trip rhythm')
          for old,new in [('className="border-b border-border/50 pb-6 mb-6 space-y-2"','className="space-y-2"'),('className="border-b border-border/50 pb-6 mb-6 space-y-4"','className="space-y-4"'),('className="border-b border-border/50 pb-6 mb-6 space-y-2 pt-2 sm:pt-4"','className="space-y-2 pt-1"'),('className="border-b border-border/50 pb-6 mb-6 space-y-3 pt-2 sm:pt-4"','className="space-y-3"')]: s=s.replace(old,new)
          s=s.replace('className="rounded-xl border border-border/30 bg-surface/20 p-3 sm:p-4 shadow-none flex flex-wrap gap-2 text-xs text-muted-foreground"','className="flex flex-wrap gap-2 text-xs text-muted-foreground"').replace('className="inline-flex items-center px-2.5 py-1 rounded-lg bg-background/50 border border-border/30 text-muted-foreground/80"','className="inline-flex items-center rounded-full bg-surface/60 px-2.5 py-1 text-muted-foreground/80"'); write(p,s)

          p='src/routes/_authenticated/trips.$tripId.invite.tsx'; s=read(p)
          share_start=s.index('      {!inviteStepCompleted ? (\n      <section className="space-y-4 border-b border-border/55 pb-7">'); share_end=s.index('\n      {data.isOwner ? (',share_start)
          share='''      {data.isOwner ? (\n        <section className="border-b border-border/45 pb-5">\n          <button type="button" onClick={shareInvitation} className="inline-flex min-h-10 items-center gap-2 text-[14px] font-semibold text-primary underline-offset-4 hover:underline"><KrewIcon name="invite" tone="plum" size="sm" className="size-4" />Inviter via WhatsApp <span aria-hidden="true">→</span></button>\n        </section>\n      ) : null}\n'''
          s=s[:share_start]+share+s[share_end:]
          s=must_replace(s,'<section className="space-y-4">\n        <div className="flex flex-wrap items-end justify-between gap-3 border-b border-border/45 pb-3">','<section className="space-y-3">\n        <div className="flex flex-wrap items-end justify-between gap-3 border-b border-border/45 pb-2">','invite team header')
          s=must_replace(s,'<div key={p.id} className="grid gap-3 py-4 first:pt-0 sm:grid-cols-[minmax(0,1fr)_auto] sm:items-center">','<div key={p.id} className="grid gap-2 py-2.5 first:pt-0 sm:grid-cols-[minmax(0,1fr)_auto] sm:items-center">','invite rows')
          s=s.replace('{p.email ? <p className="break-all text-[13px] text-muted-foreground">{p.email}</p> : null}','{p.email && !p.display_name ? <p className="break-all text-[12px] text-muted-foreground">{p.email}</p> : null}')
          s=s.replace('className="gap-1 px-2 py-0.5 text-[12px] bg-amber-500/10 text-amber-700 border-amber-500/20"','className="gap-1 border-primary/15 bg-primary/[0.07] px-2 py-0.5 text-[12px] text-primary"').replace('className="size-3 fill-amber-500 text-amber-500"','className="size-3 text-primary"')
          s=must_replace(s,'{!inviteStepCompleted && (trip.has_star || trip.celebrated_person || STAR_EVENT_TYPES.has(trip.event_type)) ? (','{trip.has_star || trip.celebrated_person || STAR_EVENT_TYPES.has(trip.event_type) ? (','star invite always visible')
          s=s.replace('Une fois le lien partagé et le rôle de la Star configuré, retourne au voyage pour poursuivre l’organisation.','Enregistre les choix de la Star puis retourne au voyage pour poursuivre l’organisation.').replace('Accéder au tableau de bord du voyage','{inviteStepCompleted ? "Enregistrer et revenir au voyage" : "Accéder au tableau de bord du voyage"}'); write(p,s)

          p='src/routes/_authenticated/trips.$tripId.star.tsx'; s=read(p)
          s=must_replace(s,'import { getStarPreferences, submitStarPreferences } from "@/lib/star-preferences.functions";','import { getStarPreferences, submitStarPreferences } from "@/lib/star-preferences.functions";\nimport { finalizeInvitationStep } from "@/lib/trips.functions";','star import')
          s=must_replace(s,'  const submit = useServerFn(submitStarPreferences);','  const submit = useServerFn(submitStarPreferences);\n  const saveStarSetup = useServerFn(finalizeInvitationStep);','star server fn')
          redirect='''  useEffect(() => {\n    if ((data as any)?.starMode === "participant") {\n      navigate({ to: "/trips/$tripId", params: { tripId }, replace: true });\n    }\n  }, [data, navigate, tripId]);\n\n'''; s=must_replace(s,redirect,'','star redirect')
          s=must_replace(s,'  const [wanted, setWanted] = useState<string[]>([]);','  const [starMode, setStarMode] = useState<"secret" | "participant">("secret");\n  const [starPaysShare, setStarPaysShare] = useState(true);\n  const [wanted, setWanted] = useState<string[]>([]);','star states')
          marker='  useEffect(() => {\n    if (data && !hydrated) {'; s=must_replace(s,marker,'  useEffect(() => {\n    if (data) { setStarMode((data as any).starMode === "participant" ? "participant" : "secret"); setStarPaysShare((data as any).starPaysShare !== false); }\n  }, [data]);\n\n'+marker,'star hydrate')
          mutation='''  const setupMutation = useMutation({\n    mutationFn: () => saveStarSetup({ data: { tripId, starMode, starPaysShare } }),\n    onSuccess: () => { toast.success("Choix de la Star enregistrés"); queryClient.invalidateQueries({ queryKey: ["star-prefs", tripId] }); queryClient.invalidateQueries({ queryKey: ["trip", tripId] }); },\n    onError: (e: any) => toast.error(String(e?.message ?? "Impossible d’enregistrer ces choix").slice(0, 140)),\n  });\n\n'''; s=must_replace(s,'  const mutation = useMutation({',mutation+'  const mutation = useMutation({','star mutation')
          old='''      <section className="space-y-5 border-y border-border/50 py-6">\n        <div className="space-y-1.5">\n          <h2 className="font-display text-2xl font-normal text-foreground">Pour commencer</h2>\n          <p className="text-sm leading-relaxed text-muted-foreground">On reprend d’abord les choix définis pour la Star, comme les premières réponses de son questionnaire.</p>\n        </div>\n        <div className="grid gap-5 sm:grid-cols-2 sm:gap-7">\n          <div className="space-y-2">\n            <p className="text-base font-semibold leading-snug text-foreground">Comment participe {starName} à l’organisation ?</p>\n            <p className="text-sm leading-relaxed text-muted-foreground">Mode secret · tu complètes ses réponses à sa place.</p>\n          </div>\n          <div className="space-y-2">\n            <p className="text-base font-semibold leading-snug text-foreground">La Star participe-t-elle aux frais ?</p>\n            <p className="text-sm leading-relaxed text-muted-foreground">{data.starPaysShare ? "Oui, sa part reste incluse." : "Non, sa part est répartie entre le groupe."}</p>\n          </div>\n        </div>\n      </section>'''
          new='''      <section className="space-y-6 border-b border-border/50 pb-8">\n        <div className="space-y-1.5"><h2 className="font-display text-2xl font-normal text-foreground">Pour commencer</h2><p className="text-sm leading-relaxed text-muted-foreground">Ces deux choix restent modifiables si l’organisation évolue.</p></div>\n        <div className="space-y-4">\n          <div className="space-y-3"><p className="text-base font-semibold leading-snug text-foreground">Comment participe {starName} à l’organisation ?</p><div className="grid gap-3 sm:grid-cols-2"><SelectableOption active={starMode === "secret"} onClick={() => data.trip.isOwner && setStarMode("secret")} className={!data.trip.isOwner ? "pointer-events-none opacity-60" : undefined}>Mode secret · tu complètes ses réponses</SelectableOption><SelectableOption active={starMode === "participant"} onClick={() => data.trip.isOwner && setStarMode("participant")} className={!data.trip.isOwner ? "pointer-events-none opacity-60" : undefined}>Mode participant · la Star répond elle-même</SelectableOption></div></div>\n          <div className="space-y-3"><p className="text-base font-semibold leading-snug text-foreground">La Star participe-t-elle aux frais ?</p><div className="grid gap-3 sm:grid-cols-2"><SelectableOption active={starPaysShare} onClick={() => data.trip.isOwner && setStarPaysShare(true)} className={!data.trip.isOwner ? "pointer-events-none opacity-60" : undefined}>Oui, sa part reste incluse</SelectableOption><SelectableOption active={!starPaysShare} onClick={() => data.trip.isOwner && setStarPaysShare(false)} className={!data.trip.isOwner ? "pointer-events-none opacity-60" : undefined}>Non, sa part est répartie</SelectableOption></div></div>\n        </div>\n        {data.trip.isOwner ? <Button variant="outline" onClick={() => setupMutation.mutate()} disabled={setupMutation.isPending} className="w-full sm:w-auto">{setupMutation.isPending ? <Loader2 className="size-4 animate-spin" /> : null}Enregistrer ces choix</Button> : null}\n      </section>'''; s=must_replace(s,old,new,'star editable setup')
          s=s.replace('disabled={mutation.isPending}\n            onClick={() => mutation.mutate()}','disabled={mutation.isPending || starMode !== "secret"}\n            onClick={() => mutation.mutate()}').replace('{data.preferences ? "Modifier" : "Enregistrer les préférences de la star"}','{starMode !== "secret" ? "Passe en mode secret pour compléter ce questionnaire" : data.preferences ? "Modifier" : "Enregistrer les préférences de la star"}'); write(p,s)

          p='src/routes/_authenticated/trips.$tripId.index.tsx'; s=read(p)
          marker='{/* PARAMÈTRES STAR SI VOYAGE STAR (PRÉSENTATION LÉGÈRE ET ÉLÉGANTE SANS CARRÉ VERT) */}'; start=s.index(marker); participant=s.index('participants.length === 0 ? (',start); ul=s.rfind('<ul',start,participant)
          if ul<0: raise SystemExit('participant ul not found')
          s=s[:start]+s[ul:]
          am='{/* ACTION INVITATION / PARTAGE SANS VERT WHATSAPP NI AMBER (UNIFIED 40px/12px/600/12px) */}'; a=s.index(am); close=s.index('\n          </section>',a)
          repl='''{/* ACTION UNIQUE : RELANCER LE GROUPE */}\n            {data.isOwner ? <div className="pt-4 border-t border-border/40"><Button type="button" variant="ghost" className="w-full sm:w-auto" onClick={() => shareOnWhatsApp(buildWhatsAppRemindMessage())}><KrewIcon name="group" tone="plum" size="sm" className="size-4 shrink-0" /><span>Relancer le groupe</span></Button></div> : null}'''; s=s[:a]+repl+s[close:]
          s=must_replace(s,'className="mt-6 sm:mt-8 space-y-4 bg-surface/30 rounded-[20px] p-5 sm:p-7 scroll-mt-24 relative overflow-hidden"','className="mt-6 sm:mt-8 space-y-5 scroll-mt-24 relative"','transport open')
          s=s.replace('className="rounded-xl font-medium min-h-[40px] h-auto py-2 whitespace-normal text-center leading-tight"','className="w-full sm:w-auto"')
          s=s.replace('size="sm"\n                disabled={generateTasksMutation.isPending || tasksQuery.isLoading}\n                onClick={() => generateTasksMutation.mutate()}\n                className="rounded-xl font-medium gap-1.5"','disabled={generateTasksMutation.isPending || tasksQuery.isLoading}\n                onClick={() => generateTasksMutation.mutate()}\n                className="w-full sm:w-auto"').replace('                Préparer les tâches\n              </Button>','                <span className="text-center">Préparer les tâches</span>\n              </Button>',1); write(p,s)

          Path('.github/workflows/apply-krew-ux-polish-round2.yml').unlink()
          PY
          git config user.name "KREW UX Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: apply KREW UX polish round 2"
          git push origin HEAD:fix/krew-ux-polish-round-2
