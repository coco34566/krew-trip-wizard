name: Apply KREW UX polish round 2

on:
  push:
    branches:
      - fix/krew-ux-polish-round-2

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'fix: apply KREW UX polish round 2') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/krew-ux-polish-round-2
          fetch-depth: 0
      - name: Apply targeted UX corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()
          def write(path, text):
              Path(path).write_text(text)
          def must_replace(text, old, new, label, count=1):
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{label}: expected {count}, found {actual}")
              return text.replace(old, new, count)

          # Landing: use an unmistakably KREW sage post-it.
          p = 'src/routes/index.tsx'
          s = read(p)
          s = must_replace(s,
              '<KrewNote variant="tape" tone="cream" rotation={-1} size="sm" className="w-fit text-sm pointer-events-none">Le plan prend forme ici</KrewNote>',
              '<KrewNote variant="tape" tone="sage" rotation={-1} size="sm" className="w-fit text-sm pointer-events-none">Le plan prend forme ici</KrewNote>',
              'landing post-it')
          write(p, s)

          # Dashboard: tighten the space between hero summary and progress KPIs.
          p = 'src/components/krew/TripHubDashboard.tsx'
          s = read(p)
          s = must_replace(s,
              '<div className="mx-0 my-4 sm:my-6 overflow-hidden relative space-y-3">',
              '<div className="mx-0 mt-2 mb-4 sm:mt-3 sm:mb-5 overflow-hidden relative space-y-3">',
              'dashboard KPI spacing')
          write(p, s)

          # Parcours: next step is a real KREW taped post-it.
          p = 'src/components/krew/KrewJourneyTimeline.tsx'
          s = read(p)
          s = must_replace(s,
              '<KrewNote variant="label" tone="plum" rotation={-1} className="w-fit text-[13px]">\n          Prochaine étape\n        </KrewNote>',
              '<KrewNote variant="tape" tone="sage" rotation={-1} size="sm" className="w-fit text-[13px]">\n          Prochaine étape\n        </KrewNote>',
              'timeline next post-it')
          write(p, s)

          # Availability: KREW response note + more breathing room before mode controls.
          p = 'src/routes/_authenticated/trips.$tripId.availability.tsx'
          s = read(p)
          s = must_replace(s,
              '<KrewNote variant="label" tone="cream" rotation={-1} className="inline-block px-3 py-1.5 text-[14px]">',
              '<KrewNote variant="tape" tone="sage" rotation={-1} size="sm" className="inline-block px-3 py-1.5 text-[14px]">',
              'availability missing answers note')
          s = must_replace(s,
              '<section className="w-full space-y-6">',
              '<section className="w-full space-y-7">',
              'availability rhythm')
          s = must_replace(s,
              '<div className="flex flex-wrap gap-2" role="group" aria-label="Mode de sélection des dates">',
              '<div className="flex flex-wrap gap-2 pt-1" role="group" aria-label="Mode de sélection des dates">',
              'availability mode spacing')
          s = s.replace('<KrewNote variant="tape" tone="cream" rotation={-1} className="inline-block px-3 py-1.5 text-[14px]">On cherche le bon créneau</KrewNote>',
                        '<KrewNote variant="tape" tone="sage" rotation={-1} size="sm" className="inline-block px-3 py-1.5 text-[14px]">On cherche le bon créneau</KrewNote>')
          write(p, s)

          # Compact transport time preferences: same data, much less visual mass.
          p = 'src/components/krew/TransportTimePrefsCard.tsx'
          s = read(p)
          start = s.index('  return (\n    <div className="space-y-5">')
          end = s.index('\n  );\n}', start) + len('\n  );')
          compact = '''  return (\n    <section className="space-y-3 border-y border-border/45 py-4">\n      <div className="flex flex-col gap-1 sm:flex-row sm:items-baseline sm:justify-between sm:gap-4">\n        <div className="flex items-center gap-2">\n          <KrewIcon name="time" tone="plum" size="sm" className="size-4 shrink-0" />\n          <h3 className="font-display text-[19px] font-normal text-foreground">Mes créneaux</h3>\n        </div>\n        <p className="text-[12px] leading-relaxed text-muted-foreground">Les deux horaires utiles pour chercher tes trajets.</p>\n      </div>\n\n      <div className="grid gap-3 sm:grid-cols-[minmax(0,1fr)_minmax(0,1fr)_auto] sm:items-end">\n        <label className="space-y-1.5">\n          <span className="block text-[12px] font-semibold text-foreground">Aller · disponible dès</span>\n          <Input type="time" className="h-9 min-h-9 rounded-[9px] border-border/55 text-sm font-mono" value={earliest} onChange={(e) => setEarliest(e.target.value)} />\n        </label>\n        <label className="space-y-1.5">\n          <span className="block text-[12px] font-semibold text-foreground">Retour · rentré avant</span>\n          <Input type="time" className="h-9 min-h-9 rounded-[9px] border-border/55 text-sm font-mono" value={latest} onChange={(e) => setLatest(e.target.value)} />\n        </label>\n        <Button size="sm" onClick={() => saveMutation.mutate()} disabled={saveMutation.isPending || isMyPrefsLoading} className="w-full sm:w-auto">\n          {saveMutation.isPending ? <Loader2 className="size-4 animate-spin" /> : <KrewIcon name="check" tone="plum" size="sm" className="size-4" />}\n          Enregistrer\n        </Button>\n      </div>\n    </section>\n  );'''
          s = s[:start] + compact + s[end:]
          write(p, s)

          # New trip form: open editorial form, no arbitrary separators between questions.
          p = 'src/routes/_authenticated/trips.new.tsx'
          s = read(p)
          s = must_replace(s,
              '<main className="mx-auto max-w-[820px] px-4 sm:px-6 py-6 sm:py-8 space-y-6 sm:space-y-8">',
              '<main className="mx-auto max-w-[820px] px-5 sm:px-7 py-6 sm:py-8 space-y-6 sm:space-y-8">',
              'new trip gutters')
          s = must_replace(s, '<form onSubmit={onSubmit} className="pt-2">', '<form onSubmit={onSubmit} className="space-y-8 pt-2">', 'new trip form rhythm')
          for old, new in [
              ('className="border-b border-border/50 pb-6 mb-6 space-y-2"', 'className="space-y-2"'),
              ('className="border-b border-border/50 pb-6 mb-6 space-y-4"', 'className="space-y-4"'),
              ('className="border-b border-border/50 pb-6 mb-6 space-y-2 pt-2 sm:pt-4"', 'className="space-y-2 pt-1"'),
              ('className="border-b border-border/50 pb-6 mb-6 space-y-3 pt-2 sm:pt-4"', 'className="space-y-3"'),
          ]:
              s = s.replace(old, new)
          s = s.replace('className="rounded-xl border border-border/30 bg-surface/20 p-3 sm:p-4 shadow-none flex flex-wrap gap-2 text-xs text-muted-foreground"',
                        'className="flex flex-wrap gap-2 text-xs text-muted-foreground"')
          s = s.replace('className="inline-flex items-center px-2.5 py-1 rounded-lg bg-background/50 border border-border/30 text-muted-foreground/80"',
                        'className="inline-flex items-center rounded-full bg-surface/60 px-2.5 py-1 text-muted-foreground/80"')
          write(p, s)

          # Invite: one compact WhatsApp invite action, compact team list, Star settings remain available.
          p = 'src/routes/_authenticated/trips.$tripId.invite.tsx'
          s = read(p)
          share_start = s.index('      {!inviteStepCompleted ? (\n      <section className="space-y-4 border-b border-border/55 pb-7">')
          share_end = s.index('\n      {data.isOwner ? (', share_start)
          share_block = '''      {data.isOwner ? (\n        <section className="border-b border-border/45 pb-5">\n          <button type="button" onClick={shareInvitation} className="inline-flex min-h-10 items-center gap-2 text-[14px] font-semibold text-primary underline-offset-4 hover:underline">\n            <KrewIcon name="invite" tone="plum" size="sm" className="size-4" />\n            Inviter via WhatsApp <span aria-hidden="true">→</span>\n          </button>\n        </section>\n      ) : null}\n'''
          s = s[:share_start] + share_block + s[share_end:]
          s = must_replace(s,
              '<section className="space-y-4">\n        <div className="flex flex-wrap items-end justify-between gap-3 border-b border-border/45 pb-3">',
              '<section className="space-y-3">\n        <div className="flex flex-wrap items-end justify-between gap-3 border-b border-border/45 pb-2">',
              'invite team compact header')
          s = must_replace(s,
              '<div key={p.id} className="grid gap-3 py-4 first:pt-0 sm:grid-cols-[minmax(0,1fr)_auto] sm:items-center">',
              '<div key={p.id} className="grid gap-2 py-2.5 first:pt-0 sm:grid-cols-[minmax(0,1fr)_auto] sm:items-center">',
              'invite team rows')
          s = s.replace('{p.email ? <p className="break-all text-[13px] text-muted-foreground">{p.email}</p> : null}',
                        '{p.email && !p.display_name ? <p className="break-all text-[12px] text-muted-foreground">{p.email}</p> : null}')
          s = s.replace('className="gap-1 px-2 py-0.5 text-[12px] bg-amber-500/10 text-amber-700 border-amber-500/20"',
                        'className="gap-1 border-primary/15 bg-primary/[0.07] px-2 py-0.5 text-[12px] text-primary"')
          s = s.replace('className="size-3 fill-amber-500 text-amber-500"', 'className="size-3 text-primary"')
          s = must_replace(s,
              '{!inviteStepCompleted && (trip.has_star || trip.celebrated_person || STAR_EVENT_TYPES.has(trip.event_type)) ? (',
              '{trip.has_star || trip.celebrated_person || STAR_EVENT_TYPES.has(trip.event_type) ? (',
              'invite Star settings always visible')
          s = s.replace('Une fois le lien partagé et le rôle de la Star configuré, retourne au voyage pour poursuivre l’organisation.',
                        'Enregistre les choix de la Star puis retourne au voyage pour poursuivre l’organisation.')
          s = s.replace('Accéder au tableau de bord du voyage', '{inviteStepCompleted ? "Enregistrer et revenir au voyage" : "Accéder au tableau de bord du voyage"}')
          write(p, s)

          # Star questionnaire: remove forced redirect and make the two setup questions editable in questionnaire grammar.
          p = 'src/routes/_authenticated/trips.$tripId.star.tsx'
          s = read(p)
          s = must_replace(s,
              'import { getStarPreferences, submitStarPreferences } from "@/lib/star-preferences.functions";',
              'import { getStarPreferences, submitStarPreferences } from "@/lib/star-preferences.functions";\nimport { finalizeInvitationStep } from "@/lib/trips.functions";',
              'star setup import')
          old_redirect = '''  useEffect(() => {\n    if ((data as any)?.starMode === "participant") {\n      navigate({ to: "/trips/$tripId", params: { tripId }, replace: true });\n    }\n  }, [data, navigate, tripId]);\n\n'''
          s = must_replace(s, old_redirect, '', 'remove star participant redirect')
          s = must_replace(s,
              '  const submit = useServerFn(submitStarPreferences);',
              '  const submit = useServerFn(submitStarPreferences);\n  const saveStarSetup = useServerFn(finalizeInvitationStep);',
              'star setup server fn')
          s = must_replace(s,
              '  const [wanted, setWanted] = useState<string[]>([]);',
              '  const [starMode, setStarMode] = useState<"secret" | "participant">("secret");\n  const [starPaysShare, setStarPaysShare] = useState(true);\n  const [wanted, setWanted] = useState<string[]>([]);',
              'star setup state')
          hydrate_marker = '  useEffect(() => {\n    if (data && !hydrated) {'
          s = must_replace(s, hydrate_marker,
              '  useEffect(() => {\n    if (data) {\n      setStarMode((data as any).starMode === "participant" ? "participant" : "secret");\n      setStarPaysShare((data as any).starPaysShare !== false);\n    }\n  }, [data]);\n\n' + hydrate_marker,
              'hydrate star setup')
          mutation_marker = '  const mutation = useMutation({'
          setup_mutation = '''  const setupMutation = useMutation({\n    mutationFn: () => saveStarSetup({ data: { tripId, starMode, starPaysShare } }),\n    onSuccess: () => {\n      toast.success("Choix de la Star enregistrés");\n      queryClient.invalidateQueries({ queryKey: ["star-prefs", tripId] });\n      queryClient.invalidateQueries({ queryKey: ["trip", tripId] });\n    },\n    onError: (e: any) => toast.error(String(e?.message ?? "Impossible d’enregistrer ces choix").slice(0, 140)),\n  });\n\n'''
          s = must_replace(s, mutation_marker, setup_mutation + mutation_marker, 'star setup mutation')
          old_setup = '''      <section className="space-y-5 border-y border-border/50 py-6">\n        <div className="space-y-1.5">\n          <h2 className="font-display text-2xl font-normal text-foreground">Pour commencer</h2>\n          <p className="text-sm leading-relaxed text-muted-foreground">On reprend d’abord les choix définis pour la Star, comme les premières réponses de son questionnaire.</p>\n        </div>\n        <div className="grid gap-5 sm:grid-cols-2 sm:gap-7">\n          <div className="space-y-2">\n            <p className="text-base font-semibold leading-snug text-foreground">Comment participe {starName} à l’organisation ?</p>\n            <p className="text-sm leading-relaxed text-muted-foreground">Mode secret · tu complètes ses réponses à sa place.</p>\n          </div>\n          <div className="space-y-2">\n            <p className="text-base font-semibold leading-snug text-foreground">La Star participe-t-elle aux frais ?</p>\n            <p className="text-sm leading-relaxed text-muted-foreground">{data.starPaysShare ? "Oui, sa part reste incluse." : "Non, sa part est répartie entre le groupe."}</p>\n          </div>\n        </div>\n      </section>'''
          new_setup = '''      <section className="space-y-6 border-b border-border/50 pb-8">\n        <div className="space-y-1.5">\n          <h2 className="font-display text-2xl font-normal text-foreground">Pour commencer</h2>\n          <p className="text-sm leading-relaxed text-muted-foreground">Ces deux choix restent modifiables si l’organisation évolue.</p>\n        </div>\n        <div className="space-y-4">\n          <div className="space-y-3">\n            <p className="text-base font-semibold leading-snug text-foreground">Comment participe {starName} à l’organisation ?</p>\n            <div className="grid gap-3 sm:grid-cols-2">\n              <SelectableOption active={starMode === "secret"} onClick={() => data.trip.isOwner && setStarMode("secret")} className={!data.trip.isOwner ? "pointer-events-none opacity-60" : undefined}>Mode secret · tu complètes ses réponses</SelectableOption>\n              <SelectableOption active={starMode === "participant"} onClick={() => data.trip.isOwner && setStarMode("participant")} className={!data.trip.isOwner ? "pointer-events-none opacity-60" : undefined}>Mode participant · la Star répond elle-même</SelectableOption>\n            </div>\n          </div>\n          <div className="space-y-3">\n            <p className="text-base font-semibold leading-snug text-foreground">La Star participe-t-elle aux frais ?</p>\n            <div className="grid gap-3 sm:grid-cols-2">\n              <SelectableOption active={starPaysShare} onClick={() => data.trip.isOwner && setStarPaysShare(true)} className={!data.trip.isOwner ? "pointer-events-none opacity-60" : undefined}>Oui, sa part reste incluse</SelectableOption>\n              <SelectableOption active={!starPaysShare} onClick={() => data.trip.isOwner && setStarPaysShare(false)} className={!data.trip.isOwner ? "pointer-events-none opacity-60" : undefined}>Non, sa part est répartie</SelectableOption>\n            </div>\n          </div>\n        </div>\n        {data.trip.isOwner ? (\n          <Button variant="outline" onClick={() => setupMutation.mutate()} disabled={setupMutation.isPending} className="w-full sm:w-auto">\n            {setupMutation.isPending ? <Loader2 className="size-4 animate-spin" /> : null}\n            Enregistrer ces choix\n          </Button>\n        ) : null}\n      </section>'''
          s = must_replace(s, old_setup, new_setup, 'editable star setup')
          s = s.replace('disabled={mutation.isPending}\n            onClick={() => mutation.mutate()}',
                        'disabled={mutation.isPending || starMode !== "secret"}\n            onClick={() => mutation.mutate()}')
          s = s.replace('{data.preferences ? "Modifier" : "Enregistrer les préférences de la star"}',
                        '{starMode !== "secret" ? "Passe en mode secret pour compléter ce questionnaire" : data.preferences ? "Modifier" : "Enregistrer les préférences de la star"}')
          write(p, s)

          # Huge trip page: remove duplicate Star settings from members, leave only group reminder, open Transport section, canonical buttons.
          p = 'src/routes/_authenticated/trips.$tripId.index.tsx'
          s = read(p)
          marker = '{/* PARAMÈTRES STAR SI VOYAGE STAR (PRÉSENTATION LÉGÈRE ET ÉLÉGANTE SANS CARRÉ VERT) */}'
          start = s.index(marker)
          participant_anchor = s.index('participants.length === 0 ? (', start)
          ul_start = s.rfind('<ul', start, participant_anchor)
          if ul_start < 0:
              raise SystemExit('members star block: participant ul not found')
          s = s[:start] + s[ul_start:]

          action_marker = '{/* ACTION INVITATION / PARTAGE SANS VERT WHATSAPP NI AMBER (UNIFIED 40px/12px/600/12px) */}'
          astart = s.index(action_marker)
          section_close = s.index('\n          </section>', astart)
          replacement = '''{/* ACTION UNIQUE : RELANCER LE GROUPE */}\n            {data.isOwner ? (\n              <div className="pt-4 border-t border-border/40">\n                <Button type="button" variant="ghost" className="w-full sm:w-auto" onClick={() => shareOnWhatsApp(buildWhatsAppRemindMessage())}>\n                  <KrewIcon name="group" tone="plum" size="sm" className="size-4 shrink-0" />\n                  <span>Relancer le groupe</span>\n                </Button>\n              </div>\n            ) : null}'''
          s = s[:astart] + replacement + s[section_close:]

          s = must_replace(s,
              'className="mt-6 sm:mt-8 space-y-4 bg-surface/30 rounded-[20px] p-5 sm:p-7 scroll-mt-24 relative overflow-hidden"',
              'className="mt-6 sm:mt-8 space-y-5 scroll-mt-24 relative"',
              'open transport section')
          s = s.replace('className="rounded-xl font-medium min-h-[40px] h-auto py-2 whitespace-normal text-center leading-tight"',
                        'className="w-full sm:w-auto"')
          s = s.replace('size="sm"\n                disabled={generateTasksMutation.isPending || tasksQuery.isLoading}\n                onClick={() => generateTasksMutation.mutate()}\n                className="rounded-xl font-medium gap-1.5"',
                        'disabled={generateTasksMutation.isPending || tasksQuery.isLoading}\n                onClick={() => generateTasksMutation.mutate()}\n                className="w-full sm:w-auto"')
          s = s.replace('                Préparer les tâches\n              </Button>', '                <span className="text-center">Préparer les tâches</span>\n              </Button>', 1)
          write(p, s)

          # Remove this one-off workflow from the final branch.
          Path('.github/workflows/apply-krew-ux-polish-round2.yml').unlink()
          PY

          git config user.name "KREW UX Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: apply KREW UX polish round 2"
          git push origin HEAD:fix/krew-ux-polish-round-2
