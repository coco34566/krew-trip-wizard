      - name: Install dependencies
        run: npm ci

      - name: Run focused stateful tests
        run: npx vitest run src/components/krew/KrewStatefulButton.test.tsx src/components/krew/TransportTimePrefsCard.test.tsx

      - name: Run existing unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Commit consolidated pass to feature branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "KREW UX Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/krew/KrewStatefulButton.tsx \
                  src/components/krew/KrewStatefulButton.test.tsx \
                  src/components/krew/TransportTimePrefsCard.tsx \
                  src/components/krew/TransportTimePrefsCard.test.tsx \
                  'src/routes/_authenticated/trips.$tripId.invite.tsx' \
                  'src/routes/_authenticated/trips.$tripId.star.tsx' \
                  'src/routes/_authenticated/trips.$tripId.index.tsx'
          git commit -m "feat(ui): extend KREW stateful action feedback"
          git push origin HEAD:feat/krew-stateful-buttons
