name: Apply KREW stateful buttons

on:
  push:
    branches:
      - ops/krew-stateful-buttons-applier
    paths:
      - .github/workflows/apply-krew-stateful-buttons.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/krew-stateful-buttons
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch applier scripts
        run: |
          git show origin/ops/krew-stateful-buttons-applier:.github/scripts/apply-krew-stateful-buttons.py > /tmp/apply-krew-stateful-buttons.py
          git show origin/ops/krew-stateful-buttons-applier:.github/scripts/fix-krew-stateful-tests.py > /tmp/fix-krew-stateful-tests.py

      - name: Apply targeted changes
        run: |
          python /tmp/apply-krew-stateful-buttons.py
          python /tmp/fix-krew-stateful-tests.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused tests
        run: npx vitest run src/components/krew/KrewStatefulButton.test.tsx src/components/krew/TransportTimePrefsCard.test.tsx

      - name: Run existing tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Commit consolidated pass
        run: |
          git config user.name "KREW UX Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/krew/KrewStatefulButton.tsx \
                  src/components/krew/KrewStatefulButton.test.tsx \
                  src/components/krew/TransportTimePrefsCard.tsx \
                  src/components/krew/TransportTimePrefsCard.test.tsx \
                  'src/routes/_authenticated/trips.$tripId.invite.tsx' \
                  'src/routes/_authenticated/trips.$tripId.star.tsx' \
                  'src/routes/_authenticated/trips.$tripId.index.tsx'
          git commit -m "feat(ui): extend KREW stateful action feedback"
          git push origin HEAD:feat/krew-stateful-buttons
