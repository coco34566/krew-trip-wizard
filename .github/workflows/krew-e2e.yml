name: KREW one-off planning patch

on:
  push:
    branches: [fix/transport-mobile-compact-preferences]

permissions:
  contents: write

jobs:
  patch-planning:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/transport-mobile-compact-preferences
          fetch-depth: 0
      - name: Apply verified-place fallback fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/trips.functions.ts")
          source = path.read_text()

          replacements = [
              (
                  "if (candidate && isSameSuggestedPlace(sp, candidate.name)) {",
                  "// The exact Gemini venue was already tried above. If it cannot be verified,\n          // keep the best verified Geoapify candidate matching the slot intent instead of\n          // rejecting every real place just because its name differs from the AI suggestion.\n          if (candidate) {",
              ),
              (
                  "if (searchCandidate && isSameSuggestedPlace(sp, searchCandidate.name)) {",
                  "// Same rule after the targeted refresh: prefer a verified intent-compatible\n              // place to a generic map fallback based on an unverified AI venue name.\n              if (searchCandidate) {",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {old!r}, found {count}")
              source = source.replace(old, new, 1)

          old_fallback = '''    label: (s as any).suggestedPlace || s.label,
    detail:
      s.detail ||
      s.searchIntent ||
      "Réservation ou choix du lieu à préciser",
    address: null,
    verified: false,
    source: "krew",
    url: fallbackMapUrl || null,'''
          new_fallback = '''    // No place was verified: keep the activity wording rather than presenting an
    // AI-suggested venue name as if KREW had validated it.
    label: s.label,
    detail:
      s.detail ||
      s.searchIntent ||
      "Réservation ou choix du lieu à préciser",
    address: null,
    verified: false,
    source: "krew",
    url: fallbackMapUrl || null,'''
          if source.count(old_fallback) != 1:
              raise SystemExit(f"Expected one unverified fallback block, found {source.count(old_fallback)}")
          source = source.replace(old_fallback, new_fallback, 1)

          old_map = '''            const fallbackMapUrl = buildVerifiedPlaceFallbackUrl(
              { name: s.label, address: destName },
              destName,
            );'''
          new_map = '''            const fallbackMapUrl = buildVerifiedPlaceFallbackUrl(
              { name: s.searchIntent || s.label, address: destName },
              destName,
            );'''
          if source.count(old_map) != 1:
              raise SystemExit(f"Expected one map fallback block, found {source.count(old_map)}")
          source = source.replace(old_map, new_map, 1)

          path.write_text(source)

          test = Path("src/lib/__tests__/planning-place-resolution-contract.test.ts")
          test.write_text('''import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n\nimport { buildFinalItinerarySlot } from "../trips.functions";\n\ndescribe("planning verified-place fallback contract", () => {\n  it("accepts a verified intent-compatible Geoapify fallback even when Gemini suggested another venue name", () => {\n    const source = readFileSync(new URL("../trips.functions.ts", import.meta.url), "utf8");\n    expect(source).not.toContain("candidate && isSameSuggestedPlace(sp, candidate.name)");\n    expect(source).not.toContain("searchCandidate && isSameSuggestedPlace(sp, searchCandidate.name)");\n  });\n\n  it("does not present an unverified AI venue name as a validated place", () => {\n    const slot = buildFinalItinerarySlot({\n      slot: {\n        moment: "Soir",\n        time: "20:00",\n        endTime: "22:00",\n        durationMinutes: 120,\n        type: "resto",\n        category: "repas",\n        venueFamily: "restaurant",\n        searchIntent: "restaurant festif tendance centre Cascais",\n        locationContext: "external",\n        label: "Dîner festif pour la future mariée",\n        suggestedPlace: "Restaurant IA non vérifié",\n        detail: "Une table festive.",\n      },\n      fallbackMapUrl: "https://www.google.com/maps/search/?api=1&query=restaurant%20festif%20Cascais",\n    });\n\n    expect(slot.verified).toBe(false);\n    expect(slot.label).toBe("Dîner festif pour la future mariée");\n  });\n});\n''')
          PY

          # Restore the normal smoke workflow in the same commit; this one-off runner disappears.
          git fetch origin main
          git checkout origin/main -- .github/workflows/krew-e2e.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/trips.functions.ts src/lib/__tests__/planning-place-resolution-contract.test.ts .github/workflows/krew-e2e.yml
          git commit -m "fix: resolve planning slots to verified real places"
          git push origin HEAD:fix/transport-mobile-compact-preferences
