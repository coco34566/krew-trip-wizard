name: Hub Migration Verification

on:
  push:
    branches: [audit/hub-migration-verification]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript noUnusedLocals
        continue-on-error: true
        run: npx tsc --noEmit --noUnusedLocals
      - name: Knip
        continue-on-error: true
        run: npx --yes knip
