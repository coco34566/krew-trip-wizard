name: Hub Migration Final Static Verification

on:
  push:
    branches: [audit/hub-migration-final-static]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript noUnusedLocals changed-files check
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --noUnusedLocals 2>&1 | tee /tmp/tsc.log
          set -e
          if grep -E 'src/(hooks/useTripHub(Data|Actions)|components/krew/TripHub(MembersSection|FinalRecap|JourneyView)|routes/_authenticated/trips\.\$tripId\.index)\.tsx?' /tmp/tsc.log; then exit 1; fi
      - name: Knip changed-files check
        shell: bash
        run: |
          set +e
          npx --yes knip 2>&1 | tee /tmp/knip.log
          set -e
          if grep -E 'src/(hooks/useTripHub(Data|Actions)|components/krew/TripHub(MembersSection|FinalRecap|JourneyView))\.tsx?' /tmp/knip.log; then exit 1; fi
