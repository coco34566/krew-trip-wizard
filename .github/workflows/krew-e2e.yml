name: KREW Smoke E2E

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

concurrency:
  group: krew-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # Repository secrets are never exposed to code coming from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    timeout-minutes: 15
    env:
      KREW_E2E_EMAIL: ${{ secrets.KREW_E2E_EMAIL }}
      KREW_E2E_PASSWORD: ${{ secrets.KREW_E2E_PASSWORD }}
      KREW_E2E_API_MODE: safe
    permissions:
      contents: read
      deployments: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Vercel preview URLs
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const { appendFileSync } = await import("node:fs");
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            "X-GitHub-Api-Version": "2022-11-28",
          };
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const api = async (path) => {
            const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}${path}`, { headers });
            if (!response.ok) throw new Error(`GitHub API ${response.status}: ${path}`);
            return response.json();
          };
          const findReadyUrlForSha = async (sha) => {
            const deployments = await api(`/deployments?sha=${sha}&per_page=20`);
            for (const deployment of deployments) {
              const statuses = await api(`/deployments/${deployment.id}/statuses?per_page=20`);
              const ready = statuses.find((status) =>
                status.state === "success" && /^https:\/\/[a-z0-9.-]+\.vercel\.app\/?$/i.test(status.environment_url || ""),
              );
              if (ready) return ready.environment_url.replace(/\/$/, "");
            }
            return "";
          };
          const findReadyUrlForEquivalentTree = async (commit) => {
            const exact = await findReadyUrlForSha(commit.sha);
            if (exact) return { url: exact, deploymentSha: commit.sha };

            const deployments = await api("/deployments?per_page=50");
            for (const deployment of deployments) {
              const candidateSha = deployment.sha;
              if (!candidateSha || candidateSha === commit.sha) continue;
              let candidate;
              try {
                candidate = await api(`/commits/${candidateSha}`);
              } catch {
                continue;
              }
              if (candidate.commit?.tree?.sha !== commit.commit?.tree?.sha) continue;
              const statuses = await api(`/deployments/${deployment.id}/statuses?per_page=20`);
              const ready = statuses.find((status) =>
                status.state === "success" && /^https:\/\/[a-z0-9.-]+\.vercel\.app\/?$/i.test(status.environment_url || ""),
              );
              if (ready) {
                return {
                  url: ready.environment_url.replace(/\/$/, ""),
                  deploymentSha: candidateSha,
                };
              }
            }
            return { url: "", deploymentSha: "" };
          };
          const isPreviewNeutral = (commit) => {
            const changedFiles = Array.isArray(commit.files) ? commit.files.map((file) => file.filename) : [];
            return changedFiles.length > 0 && changedFiles.every((file) =>
              file.startsWith(".github/") || file.startsWith("docs/") || file.startsWith("tests/"),
            );
          };
          const nearestAppCommit = async (startSha, maxDepth = 40) => {
            let commit = await api(`/commits/${startSha}`);
            for (let depth = 0; depth < maxDepth && isPreviewNeutral(commit); depth += 1) {
              const parentSha = commit.parents?.[0]?.sha;
              if (!parentSha) break;
              commit = await api(`/commits/${parentSha}`);
            }
            return commit;
          };
          const waitForPreview = async (commit) => {
            let resolved = { url: "", deploymentSha: "" };
            for (let attempt = 0; attempt < 9 && !resolved.url; attempt += 1) {
              resolved = await findReadyUrlForEquivalentTree(commit);
              if (!resolved.url) await sleep(10_000);
            }
            return resolved.url ? resolved : null;
          };
          const waitForHealthyPreview = async (url) => {
            for (let attempt = 0; attempt < 6; attempt += 1) {
              try {
                const response = await fetch(url, { redirect: "follow" });
                if (response.ok) {
                  const html = await response.text();
                  const assetPaths = [...html.matchAll(/(?:src|href)=["\u0027]([^"\u0027]+\/assets\/[^"\u0027]+)["\u0027]/gi)]
                    .map((match) => match[1])
                    .filter(Boolean)
                    .slice(0, 12);
                  const assetResults = await Promise.all(
                    assetPaths.map(async (assetPath) => {
                      const assetUrl = new URL(assetPath, url).toString();
                      try {
                        const assetResponse = await fetch(assetUrl, { redirect: "follow" });
                        return { assetUrl, ok: assetResponse.ok, status: assetResponse.status };
                      } catch (error) {
                        return { assetUrl, ok: false, status: String(error) };
                      }
                    }),
                  );
                  const brokenAssets = assetResults.filter((asset) => !asset.ok);
                  if (brokenAssets.length === 0) return true;
                  console.log("::warning::Preview HTML is up but static assets are not ready: " +
                    brokenAssets.map((asset) => asset.assetUrl + " (" + asset.status + ")").join(", "));
                }
              } catch {
                // Retry transient preview/network failures.
              }
              await sleep(5_000);
            }
            return false;
          };

          const targetCommit = await nearestAppCommit(process.env.HEAD_SHA);
          const current = await waitForPreview(targetCommit);

          if (!current || !(await waitForHealthyPreview(current.url))) {
            appendFileSync(process.env.GITHUB_ENV, "KREW_E2E_PREVIEW_AVAILABLE=false\n");
            const message = `Vercel preview unavailable or unhealthy for ${targetCommit.sha}`;
            if (process.env.EVENT_NAME === "pull_request") {
              console.log(`::warning::${message}; smoke is skipped because this is an infrastructure condition.`);
              process.exit(0);
            }
            throw new Error(message);
          }

          appendFileSync(process.env.GITHUB_ENV, "KREW_E2E_PREVIEW_AVAILABLE=true\n");
          appendFileSync(process.env.GITHUB_ENV, `KREW_E2E_BASE_URL=${current.url}\n`);
          appendFileSync(process.env.GITHUB_ENV, `KREW_E2E_APP_SHA=${targetCommit.sha}\n`);
          appendFileSync(process.env.GITHUB_ENV, `KREW_E2E_DEPLOYMENT_SHA=${current.deploymentSha}\n`);
          console.log(`Current app tree ${targetCommit.commit.tree.sha}: ${current.url} (deployment ${current.deploymentSha})`);

          if (process.env.BASE_SHA) {
            const previousAppCommit = await nearestAppCommit(process.env.BASE_SHA);
            if (previousAppCommit.sha !== targetCommit.sha) {
              const before = await waitForPreview(previousAppCommit);
              if (before) {
                appendFileSync(process.env.GITHUB_ENV, `KREW_E2E_BEFORE_URL=${before.url}\n`);
                appendFileSync(process.env.GITHUB_ENV, `KREW_E2E_BEFORE_SHA=${previousAppCommit.sha}\n`);
                appendFileSync(process.env.GITHUB_ENV, `KREW_E2E_BEFORE_DEPLOYMENT_SHA=${before.deploymentSha}\n`);
                console.log(`Before app tree ${previousAppCommit.commit.tree.sha}: ${before.url} (deployment ${before.deploymentSha})`);
              } else {
                console.log("::warning::Previous Vercel preview unavailable; comparative visual checks may be skipped.");
              }
            }
          }
          NODE

      - name: Run npm ci
        timeout-minutes: 3
        run: npm ci

      - name: Install Playwright test runner without changing the lockfile
        timeout-minutes: 2
        run: npm install --no-save --package-lock=false --legacy-peer-deps @playwright/test@1.55.0

      - name: Run advisory smoke journey on PR
        if: github.event_name == 'pull_request' && env.KREW_E2E_PREVIEW_AVAILABLE == 'true'
        timeout-minutes: 3
        continue-on-error: true
        run: |
          if npm run test:e2e:smoke; then
            exit 0
          fi
          echo "::warning::Smoke failed once; retrying once to absorb transient preview/browser failures."
          sleep 15
          npm run test:e2e:smoke

      - name: Run blocking smoke journey nightly/manual
        if: github.event_name != 'pull_request' && env.KREW_E2E_PREVIEW_AVAILABLE == 'true'
        timeout-minutes: 4
        run: |
          if npm run test:e2e:smoke; then
            exit 0
          fi
          echo "::warning::Smoke failed once; retrying once before failing the nightly/manual quality gate."
          sleep 15
          npm run test:e2e:smoke

      - name: Run canonical hub navigation and redirect E2E
        if: github.event_name == 'pull_request' && env.KREW_E2E_PREVIEW_AVAILABLE == 'true'
        timeout-minutes: 4
        run: |
          set +e
          : > canonical-e2e.log
          run_canonical() {
            npx playwright test hub-canonical-navigation.spec.ts legacy-hub-section-redirects.spec.ts --project=mobile-safari --reporter=list 2>&1 | tee -a canonical-e2e.log
            return ${PIPESTATUS[0]}
          }

          run_canonical
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::Canonical navigation failed once; retrying once."
            printf '\n===== RETRY =====\n' >> canonical-e2e.log
            sleep 10
            run_canonical
            status=$?
          fi

          if [ "$status" -ne 0 ]; then
            {
              echo '## Canonical hub navigation failures'
              echo
              echo 'The blocking Playwright navigation gate failed after one retry.'
              echo
              echo '```text'
              grep -E '✘|Error:|failed|TEST_SETUP:|Timeout' canonical-e2e.log | tail -80 || tail -80 canonical-e2e.log
              echo '```'
              echo
              echo 'Full traces, screenshots and videos are in the Playwright artifact.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$status"

      - name: Run advisory visual audit on PR
        if: always() && github.event_name == 'pull_request' && env.KREW_E2E_PREVIEW_AVAILABLE == 'true'
        timeout-minutes: 9
        continue-on-error: true
        run: npm run test:e2e:visual

      - name: Run full journey nightly/manual
        if: always() && github.event_name != 'pull_request' && env.KREW_E2E_PREVIEW_AVAILABLE == 'true'
        timeout-minutes: 12
        run: npm run test:e2e:full

      - name: Run current visual audit nightly/manual
        if: always() && github.event_name != 'pull_request' && env.KREW_E2E_PREVIEW_AVAILABLE == 'true'
        timeout-minutes: 12
        run: npm run test:e2e:visual

      - name: Capture historical design reference screenshots nightly/manual
        if: always() && github.event_name != 'pull_request' && env.KREW_E2E_PREVIEW_AVAILABLE == 'true'
        timeout-minutes: 12
        continue-on-error: true
        # Historical migration snapshots compare against an older app baseline.
        # Keep them as evidence, but never let them block current delivery.
        run: >-
          npx playwright test
          design-system-migration-visual.spec.ts
          design-harmonization-d7-visual.spec.ts
          design-harmonization-d8-visual.spec.ts
          --project=desktop-chromium
          --grep-invert "TripHub matches the approved D1 hero-title scale|Availability matches the approved chapter-title contract|Questionnaire matches the approved chapter-title contract|Nouveau voyage matches the approved D1 hero-title scale|Invite matches the approved D8 section-title contract|Account surface remains pixel-identical at contract reference viewports"

      - name: Upload Playwright report
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: krew-smoke-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
