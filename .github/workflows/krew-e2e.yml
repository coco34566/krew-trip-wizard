name: Hub Migration Final Static Verification

on:
  push:
    branches: [audit/hub-migration-final]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript noUnusedLocals changed-files check
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --noUnusedLocals 2>&1 | tee /tmp/tsc.log
          status=${PIPESTATUS[0]}
          set -e
          echo "Full tsc exit: $status"
          if grep -E 'src/(hooks/useTripHub(Data|Actions)|components/krew/TripHub(MembersSection|FinalRecap|JourneyView)|routes/_authenticated/trips\.\$tripId\.index)\.tsx?' /tmp/tsc.log; then
            echo "New/changed hub files contain TypeScript errors"
            exit 1
          fi
      - name: Knip changed-files check
        shell: bash
        run: |
          set +e
          npx --yes knip 2>&1 | tee /tmp/knip.log
          set -e
          if grep -E 'src/(hooks/useTripHub(Data|Actions)|components/krew/TripHub(MembersSection|FinalRecap|JourneyView))\.tsx?' /tmp/knip.log; then
            echo "New extracted hub modules are reported by Knip"
            exit 1
          fi
