name: KREW Smoke E2E

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  smoke:
    # Repository secrets are never exposed to code coming from a fork.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    timeout-minutes: 30
    env:
      KREW_E2E_EMAIL: ${{ secrets.KREW_E2E_EMAIL }}
      KREW_E2E_PASSWORD: ${{ secrets.KREW_E2E_PASSWORD }}
      KREW_E2E_API_MODE: safe
    permissions:
      contents: read
      deployments: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Resolve Vercel preview URLs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node <<'NODE'
          const { appendFileSync } = await import("node:fs");
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            "X-GitHub-Api-Version": "2022-11-28",
          };
          const api = async (path) => {
            const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}${path}`, { headers });
            if (!response.ok) throw new Error(`GitHub API ${response.status}: ${path}`);
            return response.json();
          };
          const findReadyUrlForSha = async (sha) => {
            const deployments = await api(`/deployments?sha=${sha}&per_page=20`);
            for (const deployment of deployments) {
              const statuses = await api(`/deployments/${deployment.id}/statuses?per_page=20`);
              const ready = statuses.find((status) =>
                status.state === "success" && /^https:\/\/[a-z0-9.-]+\.vercel\.app\/?$/i.test(status.environment_url || ""),
              );
              if (ready) return ready.environment_url.replace(/\/$/, "");
            }
            return "";
          };
          const isPreviewNeutral = (commit) => {
            const changedFiles = Array.isArray(commit.files) ? commit.files.map((file) => file.filename) : [];
            return changedFiles.length > 0 && changedFiles.every((file) =>
              file.startsWith(".github/") || file.startsWith("docs/") || file.startsWith("tests/"),
            );
          };
          const nearestAppCommit = async (startSha, maxDepth = 20) => {
            let commit = await api(`/commits/${startSha}`);
            for (let depth = 0; depth < maxDepth && isPreviewNeutral(commit); depth += 1) {
              const parentSha = commit.parents?.[0]?.sha;
              if (!parentSha) break;
              commit = await api(`/commits/${parentSha}`);
            }
            return commit;
          };

          const targetCommit = await nearestAppCommit(process.env.HEAD_SHA);
          const headIsPreviewNeutral = targetCommit.sha !== process.env.HEAD_SHA;

          let previousAppCommit = null;
          if (!headIsPreviewNeutral) {
            const parentSha = targetCommit.parents?.[0]?.sha;
            if (parentSha) previousAppCommit = await nearestAppCommit(parentSha);
          }

          const waitForPreview = async (sha) => {
            let url = "";
            for (let attempt = 0; attempt < 30 && !url; attempt += 1) {
              url = await findReadyUrlForSha(sha);
              if (!url) await new Promise((resolve) => setTimeout(resolve, 20_000));
            }
            if (!url) throw new Error(`Vercel preview URL unavailable for ${sha}`);
            return url;
          };

          const previewUrl = await waitForPreview(targetCommit.sha);
          appendFileSync(process.env.GITHUB_ENV, `KREW_E2E_BASE_URL=${previewUrl}\n`);
          appendFileSync(process.env.GITHUB_ENV, `KREW_E2E_APP_SHA=${targetCommit.sha}\n`);

          if (previousAppCommit && previousAppCommit.sha !== targetCommit.sha) {
            const beforeUrl = await waitForPreview(previousAppCommit.sha);
            appendFileSync(process.env.GITHUB_ENV, `KREW_E2E_BEFORE_URL=${beforeUrl}\n`);
            appendFileSync(process.env.GITHUB_ENV, `KREW_E2E_BEFORE_SHA=${previousAppCommit.sha}\n`);
          }
          NODE
      - run: npm ci
      - name: Install Playwright test runner without changing the lockfile
        run: npm install --no-save --package-lock=false --legacy-peer-deps @playwright/test@1.55.0
      - name: Run smoke journey only
        run: npm run test:e2e:smoke
      - name: Run full visual audit contract
        run: npm run test:e2e:visual
      - name: Capture and compare TripHub migration reference screenshots
        run: npx playwright test design-system-migration-visual.spec.ts --project=desktop-chromium
      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: krew-smoke-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
