name: Validate Impeccable (temporary)

on:
  push:
    branches:
      - chore/impeccable-design-audit

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[impeccable-validated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/impeccable-design-audit
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify context loads
        run: node .agents/skills/impeccable/scripts/context.mjs > /tmp/impeccable-context.txt && grep -q "KREW" /tmp/impeccable-context.txt
      - name: Run deterministic detector read-only
        run: node .agents/skills/impeccable/scripts/detect.mjs src > /tmp/impeccable-detect.txt || true
      - name: Cleanup temporary test branches and this workflow
        run: |
          git push origin --delete tmp/impeccable-sha-test tmp/impeccable-sha-test2 tmp/impeccable-sha-test3 || true
          git rm .github/workflows/impeccable-smoke-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: finish Impeccable validation [impeccable-validated]"
          git push origin HEAD:chore/impeccable-design-audit
