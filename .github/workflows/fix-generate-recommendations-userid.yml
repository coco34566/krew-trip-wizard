name: Apply targeted generateRecommendations userId fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-generate-recommendations-userid.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact one-line fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/trips.functions.ts')
          text = path.read_text()
          marker = 'export const generateRecommendations = createServerFn({ method: "POST" })'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('generateRecommendations marker not found')
          end = text.find('export const getGenerationReadiness', start)
          if end < 0:
              raise SystemExit('getGenerationReadiness marker not found')
          block = text[start:end]
          old = '    const { supabase } = context;'
          new = '    const { supabase, userId } = context;'
          if block.count(old) != 1:
              raise SystemExit(f'Expected exactly one target line in generateRecommendations, found {block.count(old)}')
          block = block.replace(old, new, 1)
          text = text[:start] + block + text[end:]
          path.write_text(text)
          PY

      - name: Verify targeted diff
        run: |
          git diff --check
          git diff -- src/lib/trips.functions.ts
          grep -A12 'export const generateRecommendations' src/lib/trips.functions.ts | grep 'const { supabase, userId } = context;'

      - name: Remove temporary workflow and commit fix
        run: |
          git config user.name 'KREW fix bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/fix-generate-recommendations-userid.yml
          git add src/lib/trips.functions.ts
          git commit -m 'Fix destination generation authenticated user id'
          git push origin HEAD:main
