name: Mes voyages migration runner

on:
  push:
    branches:
      - audit/css-baseline-safety
    paths:
      - .github/workflows/one-shot-triphub-candidate-v4.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/css-baseline-safety
      - name: Apply migration
        run: node .github/scripts/apply-mes-voyages-shell-migration.mjs
      - name: Commit migration
        run: |
          git config user.name "KREW migration bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/_authenticated/dashboard.tsx src/components/krew/KrewPageShell.tsx src/krew-design-tokens.css src/styles/krew-mes-voyages.css tests/e2e/design-system-migration-visual.spec.ts
          git commit -m "refactor(ui): migrate Mes voyages to KrewPageShell"
          git push origin HEAD:audit/css-baseline-safety
