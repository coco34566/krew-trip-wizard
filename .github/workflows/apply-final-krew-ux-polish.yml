name: Apply KREW polish

on:
  push:
    branches:
      - automation/apply-final-krew-ux-polish
    paths:
      - .github/workflows/apply-final-krew-ux-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-krew-ux-polish
          fetch-depth: 0
      - name: Apply corrections
        run: python .github/scripts/apply-final-krew-ux-polish.py
      - name: Commit once
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --check
          git commit -m "fix: polish final KREW journey surfaces"
          git push origin HEAD:fix/final-krew-ux-polish
