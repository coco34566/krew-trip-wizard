name: Align KREW E2E wording

on:
  push:
    branches:
      - automation/apply-final-krew-ux-polish
    paths:
      - .github/workflows/apply-final-krew-ux-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/final-krew-ux-polish-pr
          fetch-depth: 0
      - name: Align exact CTA selectors
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          paths = [
            Path('tests/e2e/full-trip-flow.spec.ts'),
            Path('tests/e2e/golden-trip-flow.spec.ts'),
          ]
          changed = 0
          for path in paths:
            text = path.read_text()
            updated = text.replace('"Générer des propositions"', '"Trouver les trajets"')
            updated = updated.replace('"Générer le planning"', '"Préparer le planning"')
            if updated != text:
              path.write_text(updated)
              changed += 1
          if changed == 0:
            raise SystemExit('No stale CTA selector found')
          print(f'Updated {changed} E2E file(s)')
          PY
          git diff --check
      - name: Commit test alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/full-trip-flow.spec.ts tests/e2e/golden-trip-flow.spec.ts
          git commit -m "test: align journey selectors with KREW wording"
          git push origin HEAD:fix/final-krew-ux-polish-pr
