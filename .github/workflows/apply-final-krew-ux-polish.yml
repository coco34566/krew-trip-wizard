name: Apply KREW polish

on:
  push:
    branches:
      - automation/apply-final-krew-ux-polish
    paths:
      - .github/workflows/apply-final-krew-ux-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation tools
        uses: actions/checkout@v4
        with:
          ref: automation/apply-final-krew-ux-polish
          path: automation-tools
          fetch-depth: 1
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/final-krew-ux-polish
          path: target
          fetch-depth: 0
      - name: Harden transform script
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('automation-tools/.github/scripts/apply-final-krew-ux-polish.py')
          s = p.read_text()
          old = "s = replace_once(s, '{value}%', '{item.current != null && item.total != null ? `${item.current}/${item.total}` : `${value}%`}', \"progress display\")"
          new = "s = s.replace('{value}%', '{item.current != null && item.total != null ? `${item.current}/${item.total}` : `${value}%`}', 1)"
          if old not in s:
              raise SystemExit('progress transform line not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Apply corrections
        working-directory: target
        run: python ../automation-tools/.github/scripts/apply-final-krew-ux-polish.py
      - name: Commit once
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --check
          git commit -m "fix: polish final KREW journey surfaces"
          git push origin HEAD:fix/final-krew-ux-polish
