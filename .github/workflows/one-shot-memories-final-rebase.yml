name: Memories final rebase

on:
  push:
    branches: [automation/memories-final-rebase]
    paths: [.github/workflows/one-shot-memories-final-rebase.yml]

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/memories-architecture-phased
          fetch-depth: 0
      - name: Rebase six phase commits onto main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          echo "before=$(git rev-parse HEAD) main=$(git rev-parse origin/main)"
          test "$(git rev-list --count origin/main..HEAD)" -eq 6
          git rebase origin/main
          test "$(git rev-list --count origin/main..HEAD)" -eq 6
          git log --oneline --reverse origin/main..HEAD
          git push --force-with-lease origin HEAD:refactor/memories-architecture-phased
