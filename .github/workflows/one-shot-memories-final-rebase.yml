name: Diagnose PR390 unit suite

on:
  push:
    branches: [automation/memories-final-rebase]
    paths: [.github/workflows/one-shot-memories-final-rebase.yml]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/memories-architecture-phased
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run exact unit suite and print failures
        shell: bash
        run: |
          set +e
          npm run test:unit > /tmp/unit.log 2>&1
          status=$?
          set -e
          echo "unit_status=$status"
          echo '=== failure markers ==='
          grep -n -E 'FAIL|Failed Tests|AssertionError|Test Files|Tests ' /tmp/unit.log | tail -n 120 || true
          echo '=== last 240 lines ==='
          tail -n 240 /tmp/unit.log
          exit "$status"
