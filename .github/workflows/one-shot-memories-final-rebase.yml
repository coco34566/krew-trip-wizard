name: Locate Memories generated-types baseline

on:
  push:
    branches: [automation/memories-final-rebase]
    paths: [.github/workflows/one-shot-memories-final-rebase.yml]

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/memories-architecture-phased
          fetch-depth: 0
      - name: Locate stale assertions
        run: |
          set -euo pipefail
          echo '=== files mentioning not.toContain trip_photos ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git 'not.toContain.*trip_photos' . || true
          echo '=== files mentioning Tables negative ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git 'not.toContain.*Tables<' . || true
          echo '=== files mentioning legacy generated baseline ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git 'legacy generated baseline' . || true
          echo '=== Supabase generated type tests ==='
          find . -type f \( -name '*generated*test*' -o -name '*types*test*' \) | sort | grep -i supabase || true
