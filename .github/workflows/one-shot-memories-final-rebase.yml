name: Finalize Memories Phase 5

on:
  push:
    branches:
      - automation/memories-final-rebase
    paths:
      - .github/workflows/one-shot-memories-final-rebase.yml
      - .github/scripts/finalize-memories-phase5.sh

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/memories-architecture-phased
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Amend Phase 5 and validate full branch
        run: bash <(curl -fsSL https://raw.githubusercontent.com/coco34566/krew-trip-wizard/automation/memories-final-rebase/.github/scripts/finalize-memories-phase5.sh)
