name: Fix KREW logo alpha
on:
  push:
    branches: [fix/transparent-krew-logo-assets]
    paths: [.github/workflows/fix-krew-logo-alpha.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/transparent-krew-logo-assets
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow numpy
      - name: Convert and validate
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          from collections import Counter, deque
          import numpy as np, json, hashlib, subprocess

          names=['krew-logo-full-dark.png','krew-logo-full-light.png','krew-logo-compact-dark.png','krew-logo-compact-light.png','krew-wordmark-dark.png','krew-wordmark-light.png']
          targets=[Path('public/brand')/n for n in names]
          def hsh(a): return hashlib.sha256(a.tobytes()).hexdigest()

          def convert(path):
              src=Image.open(path).convert('RGB'); arr=np.asarray(src,dtype=np.uint8); h,w,_=arr.shape
              b=np.median(np.array([arr[0,0],arr[0,-1],arr[-1,0],arr[-1,-1]],dtype=np.int16),axis=0).astype(float)
              diff=np.linalg.norm(arr.astype(float)-b,axis=2)
              counts=Counter(map(tuple,arr.reshape(-1,3).tolist())); pal=[]
              for rgb,n in counts.most_common():
                  p=np.array(rgb,dtype=float)
                  if np.linalg.norm(p-b)>38 and n>=3: pal.append(p)
                  if len(pal)>=32: break
              pal=np.stack(pal)
              c=arr.astype(float).reshape(-1,3); v=pal-b; vv=np.sum(v*v,axis=1); cb=c[:,None,:]-b
              aa=np.clip(np.sum(cb*v[None,:,:],axis=2)/vv[None,:],0,1)
              recon=b+aa[:,:,None]*v[None,:,:]
              res=np.sqrt(np.mean((c[:,None,:]-recon)**2,axis=2)); best=np.argmin(res,axis=1)
              a=aa[np.arange(c.shape[0]),best].reshape(h,w); r=res[np.arange(c.shape[0]),best].reshape(h,w); f=pal[best].reshape(h,w,3)
              candidate=((a<0.9995)&(r<=6.0)) | (diff<=4.0)
              conn=np.zeros((h,w),bool); q=deque()
              for x in range(w):
                  for y in (0,h-1):
                      if candidate[y,x] and not conn[y,x]: conn[y,x]=1; q.append((y,x))
              for y in range(h):
                  for x in (0,w-1):
                      if candidate[y,x] and not conn[y,x]: conn[y,x]=1; q.append((y,x))
              while q:
                  y,x=q.popleft()
                  for yy,xx in ((y-1,x),(y+1,x),(y,x-1),(y,x+1)):
                      if 0<=yy<h and 0<=xx<w and candidate[yy,xx] and not conn[yy,xx]: conn[yy,xx]=1; q.append((yy,xx))
              out=np.dstack([arr,np.full((h,w),255,np.uint8)])
              bg=conn & (diff<=4.0); out[bg,3]=0
              edge=conn & ~bg & (a<0.995) & (r<=6.0)
              out[edge,:3]=np.clip(np.rint(f[edge]),0,255).astype(np.uint8)
              out[edge,3]=np.clip(np.rint(a[edge]*255),1,254).astype(np.uint8)
              core=out[:,:,3]==255
              if not np.array_equal(out[core,:3],arr[core]): raise RuntimeError(f'opaque core changed: {path}')
              # Fidelity check by recompositing visible pixels on the exact source matte.
              al=out[:,:,3:4].astype(float)/255.0
              comp=np.rint(out[:,:,:3].astype(float)*al+b.reshape(1,1,3)*(1-al)).astype(np.uint8)
              visible=out[:,:,3]>0; delta=np.abs(comp.astype(np.int16)-arr.astype(np.int16))[visible]
              maxerr=int(delta.max()) if delta.size else 0; p99=float(np.percentile(delta,99)) if delta.size else 0.0; mean=float(delta.mean()) if delta.size else 0.0
              if p99>4 or mean>0.7: raise RuntimeError(f'fringe fidelity too low {path}: max={maxerr}, p99={p99}, mean={mean}')
              if np.any(~conn & (out[:,:,3]<255)): raise RuntimeError(f'non-connected pixels altered: {path}')
              Image.fromarray(out,'RGBA').save(path,optimize=True)
              return {'file':str(path),'size':[w,h],'source_mode':'RGB','output_mode':'RGBA','background_rgb':[int(round(x)) for x in b],
                      'transparent_pixels':int((out[:,:,3]==0).sum()),'partial_alpha_pixels':int(((out[:,:,3]>0)&(out[:,:,3]<255)).sum()),
                      'opaque_pixels':int((out[:,:,3]==255).sum()),'opaque_rgb_sha256_before':hsh(arr[core]),'opaque_rgb_sha256_after':hsh(out[core,:3]),
                      'roundtrip_max_channel_error':maxerr,'roundtrip_p99_channel_error':p99,'roundtrip_mean_channel_error':mean}

          converted=[convert(p) for p in targets]
          otters=[]; seen=set()
          for p in sorted(Path('public/brand').rglob('*otter*.png')):
              if str(p) in seen: continue
              seen.add(str(p)); im=Image.open(p); rgba=im.convert('RGBA'); al=[v[3] for v in rgba.getdata()]
              otters.append({'file':str(p),'mode':im.mode,'size':list(im.size),'alpha_min':min(al),'alpha_max':max(al),'transparent_pixels':sum(v==0 for v in al),'partial_alpha_pixels':sum(0<v<255 for v in al)})
          usage={}
          for p in targets:
              g=subprocess.run(['git','grep','-n','-F',p.name,'--',':(exclude)logo-alpha-audit.json',':(exclude).github/workflows/fix-krew-logo-alpha.yml'],capture_output=True,text=True)
              usage[p.name]=g.stdout.splitlines()
          Path('logo-alpha-validation.json').write_text(json.dumps({'converted':converted,'otters_audited_not_modified':otters,'usage':usage,'contrast_backgrounds':['#FFFFFF','#B1C4A6','#512847','#18181C']},indent=2),encoding='utf-8')
          bgs=[(255,255,255),(177,196,166),(81,40,71),(24,24,28)]
          sheet=Image.new('RGB',(1440,1140),'white')
          for row,p in enumerate(targets):
              im=Image.open(p).convert('RGBA'); im.thumbnail((320,150),Image.Resampling.LANCZOS)
              for col,bgc in enumerate(bgs):
                  cell=Image.new('RGBA',(360,190),bgc+(255,)); cell.alpha_composite(im,((360-im.width)//2,(190-im.height)//2)); sheet.paste(cell.convert('RGB'),(col*360,row*190))
          sheet.save('logo-alpha-contrast-check.png',optimize=True)
          PY
      - name: Commit corrected assets
        run: |
          rm .github/workflows/fix-krew-logo-alpha.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand/krew-logo-*.png public/brand/krew-wordmark-*.png logo-alpha-validation.json logo-alpha-contrast-check.png .github/workflows/fix-krew-logo-alpha.yml
          git commit -m "fix(brand): make KREW logo backgrounds transparent"
          git push origin HEAD:fix/transparent-krew-logo-assets
