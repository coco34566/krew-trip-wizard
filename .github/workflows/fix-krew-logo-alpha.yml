name: Fix KREW logo alpha

on:
  push:
    branches:
      - fix/transparent-krew-logo-assets
    paths:
      - .github/workflows/fix-krew-logo-alpha.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/transparent-krew-logo-assets
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow numpy
      - name: Convert only official logo and wordmark assets
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          from collections import Counter, deque
          import numpy as np, json, hashlib, subprocess

          targets = [
            Path('public/brand/krew-logo-full-dark.png'),
            Path('public/brand/krew-logo-full-light.png'),
            Path('public/brand/krew-logo-compact-dark.png'),
            Path('public/brand/krew-logo-compact-light.png'),
            Path('public/brand/krew-wordmark-dark.png'),
            Path('public/brand/krew-wordmark-light.png'),
          ]

          def sha_rgb(arr):
              return hashlib.sha256(arr.tobytes()).hexdigest()

          def convert(path):
              src = Image.open(path).convert('RGB')
              arr = np.asarray(src, dtype=np.uint8)
              h,w,_ = arr.shape
              # The corner/border background is flat in these official assets.
              corners = np.array([arr[0,0], arr[0,w-1], arr[h-1,0], arr[h-1,w-1]], dtype=np.int16)
              b = np.median(corners, axis=0).astype(np.float64)
              diff = np.linalg.norm(arr.astype(np.float64)-b, axis=2)

              # Build a palette from repeated, clearly non-background source colors.
              flat = arr.reshape(-1,3)
              counts = Counter(map(tuple, flat.tolist()))
              palette = []
              for rgb,n in counts.most_common():
                  f = np.array(rgb, dtype=np.float64)
                  if np.linalg.norm(f-b) > 38 and n >= 3:
                      palette.append(f)
                  if len(palette) >= 24:
                      break
              if not palette:
                  raise RuntimeError(f'No foreground palette found for {path}')
              pal = np.stack(palette)

              c = arr.astype(np.float64).reshape(-1,3)
              v = pal - b
              vv = np.sum(v*v, axis=1)
              cb = c[:,None,:] - b
              alpha = np.sum(cb*v[None,:,:], axis=2) / vv[None,:]
              alpha = np.clip(alpha, 0.0, 1.0)
              recon = b + alpha[:,:,None]*v[None,:,:]
              residual = np.sqrt(np.mean((c[:,None,:]-recon)**2, axis=2))
              score = residual + np.where((alpha < 0.0)|(alpha > 1.0), 1000, 0)
              best = np.argmin(score, axis=1)
              a = alpha[np.arange(c.shape[0]), best].reshape(h,w)
              r = residual[np.arange(c.shape[0]), best].reshape(h,w)
              fbest = pal[best].reshape(h,w,3)

              # Only pixels mathematically compatible with background/foreground mixing
              # can belong to the removable matte. Flood-fill from image borders so
              # similarly colored pixels inside the logo are never selected globally.
              candidate = (a < 0.9995) & (r <= 4.0)
              # Exact/near-exact background is always eligible for connectivity.
              candidate |= diff <= 4.0
              connected = np.zeros((h,w), dtype=bool)
              q = deque()
              for x in range(w):
                  for y in (0,h-1):
                      if candidate[y,x] and not connected[y,x]: connected[y,x]=1; q.append((y,x))
              for y in range(h):
                  for x in (0,w-1):
                      if candidate[y,x] and not connected[y,x]: connected[y,x]=1; q.append((y,x))
              while q:
                  y,x = q.popleft()
                  for yy,xx in ((y-1,x),(y+1,x),(y,x-1),(y,x+1)):
                      if 0 <= yy < h and 0 <= xx < w and candidate[yy,xx] and not connected[yy,xx]:
                          connected[yy,xx]=1; q.append((yy,xx))

              out = np.empty((h,w,4), dtype=np.uint8)
              out[:,:,:3] = arr
              out[:,:,3] = 255
              # True background: alpha 0. Keep original RGB under transparency.
              bgmask = connected & (a <= 0.015)
              out[bgmask,3] = 0
              # Decontaminate only the connected antialiased fringe.
              edge = connected & (a > 0.015) & (a < 0.9995)
              out[edge,:3] = np.clip(np.rint(fbest[edge]),0,255).astype(np.uint8)
              out[edge,3] = np.clip(np.rint(a[edge]*255),1,254).astype(np.uint8)

              # Validate visible core is byte-identical.
              core = out[:,:,3] == 255
              if not np.array_equal(out[core,:3], arr[core]):
                  raise RuntimeError(f'Visible core RGB changed: {path}')

              # Validate round-trip on the original matte background.
              aa = out[:,:,3:4].astype(np.float64)/255.0
              comp = np.rint(out[:,:,:3].astype(np.float64)*aa + b.reshape(1,1,3)*(1-aa)).astype(np.uint8)
              delta = np.abs(comp.astype(np.int16)-arr.astype(np.int16))
              changed_vis = out[:,:,3] > 0
              max_err = int(delta[changed_vis].max()) if changed_vis.any() else 0
              mean_err = float(delta[changed_vis].mean()) if changed_vis.any() else 0.0
              p99 = float(np.percentile(delta[changed_vis],99)) if changed_vis.any() else 0.0
              if max_err > 5 or p99 > 1.0:
                  raise RuntimeError(f'Round-trip tolerance exceeded for {path}: max={max_err}, p99={p99}')

              Image.fromarray(out, 'RGBA').save(path, optimize=True)
              return {
                'file': str(path), 'size': [w,h], 'source_mode': 'RGB', 'output_mode': 'RGBA',
                'background_rgb': [int(x) for x in b],
                'transparent_pixels': int((out[:,:,3]==0).sum()),
                'partial_alpha_pixels': int(((out[:,:,3]>0)&(out[:,:,3]<255)).sum()),
                'opaque_pixels': int((out[:,:,3]==255).sum()),
                'opaque_visible_rgb_sha256_before': sha_rgb(arr[core]),
                'opaque_visible_rgb_sha256_after': sha_rgb(out[core,:3]),
                'roundtrip_max_channel_error': max_err,
                'roundtrip_p99_channel_error': p99,
                'roundtrip_mean_channel_error': mean_err,
              }

          results = [convert(p) for p in targets]

          # Audit all otter assets without changing any of them.
          otters=[]
          for p in sorted(Path('public/brand').rglob('*otter*.png')) + sorted(Path('public/brand/otter-states').glob('*.png')):
              if any(x['file']==str(p) for x in otters): continue
              im=Image.open(p); rgba=im.convert('RGBA'); al=[a for *_,a in rgba.getdata()]
              otters.append({'file':str(p),'mode':im.mode,'size':list(im.size),'alpha_min':min(al),'alpha_max':max(al),'transparent_pixels':sum(a==0 for a in al),'partial_alpha_pixels':sum(0<a<255 for a in al)})

          # Find real application references.
          usage={}
          for p in targets:
              name=p.name
              proc=subprocess.run(['git','grep','-n','-F',name,'--',':(exclude)logo-alpha-audit.json'],capture_output=True,text=True)
              usage[name]=[line for line in proc.stdout.splitlines() if line.strip()]

          # Generate a temporary contrast preview sheet for automated/manual inspection.
          backgrounds=[('white',(255,255,255)),('sage',(177,196,166)),('plum',(81,40,71)),('dark',(24,24,28))]
          thumbs=[]
          for p in targets:
              im=Image.open(p).convert('RGBA')
              tw=320; th=max(110, round(im.height*tw/im.width))
              im.thumbnail((tw,150), Image.Resampling.LANCZOS)
              rows=[]
              for label,bg in backgrounds:
                  canvas=Image.new('RGBA',(360,190),bg+(255,));
                  x=(360-im.width)//2; y=(190-im.height)//2
                  canvas.alpha_composite(im,(x,y)); rows.append(canvas.convert('RGB'))
              thumbs.append(rows)
          sheet=Image.new('RGB',(360*4,190*len(targets)),(255,255,255))
          for j,rows in enumerate(thumbs):
              for i,im in enumerate(rows): sheet.paste(im,(i*360,j*190))
          sheet.save('logo-alpha-contrast-check.png',optimize=True)

          report={'converted':results,'otters_audited_not_modified':otters,'usage':usage,'contrast_backgrounds':['#FFFFFF','#B1C4A6','#512847','#18181C']}
          Path('logo-alpha-validation.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          PY
      - name: Commit corrected assets and validation evidence
        run: |
          rm .github/workflows/fix-krew-logo-alpha.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand/krew-logo-full-dark.png public/brand/krew-logo-full-light.png public/brand/krew-logo-compact-dark.png public/brand/krew-logo-compact-light.png public/brand/krew-wordmark-dark.png public/brand/krew-wordmark-light.png logo-alpha-validation.json logo-alpha-contrast-check.png .github/workflows/fix-krew-logo-alpha.yml
          git commit -m "fix(brand): make KREW logo backgrounds transparent"
          git push origin HEAD:fix/transparent-krew-logo-assets
